{
 id:'t46', num:'4.6', title:'The Budget & the Power of the Purse',
 lede:'Congress\'s most important power is deciding how federal money is spent. But most of the budget is on autopilot, so the fights happen over the shrinking slice that is still up for a vote each year.',
 body:`
 <h3>Where the money goes</h3>
 ${barChart({items:[{label:'Mandatory',value:61},{label:'Discretionary',value:27,color:'var(--brass)'},{label:'Net interest',value:13,color:'var(--brick)'}],max:70,step:10,unit:'%',showVal:true,ylabel:'share of federal outlays',caption:'Federal outlays, FY2024 (≈ $6.8 trillion total) · CBO data, rounded'})}
 <div class="cards">
  <div class="card"><div class="k">Mandatory spending</div><div class="v">Spending required by existing law. It doesn't need annual approval. Mostly <b>entitlements</b> — Social Security, Medicare, Medicaid — which anyone who meets the eligibility rules receives automatically. Growing fastest as the population ages.</div></div>
  <div class="card"><div class="k">Discretionary spending</div><div class="v">Spending Congress must approve every year in <b>12 appropriations bills</b>. It covers defense (about half) plus education, transportation, NASA, and everything else.</div></div>
  <div class="card"><div class="k">Net interest</div><div class="v">Payments on the <b>national debt</b>. Legally required, and now larger than the entire defense budget.</div></div>
 </div>
 <p><b>The key takeaway:</b> about three-quarters of the budget (mandatory + interest) can't be touched without changing entitlement laws, which is politically dangerous. Social Security is known as the "third rail" of American politics. Congress therefore fights over the ~27% that's discretionary.</p>

 <h3>The budget process</h3>
 <ol>
  <li><b>First Monday in February:</b> the President submits a budget proposal, prepared by the <b>Office of Management and Budget (OMB)</b>. It's only a request.</li>
  <li><b>Congressional Budget Office (CBO)</b>: the nonpartisan agency that scores bills (estimates their costs) and forecasts the economy. It gives Congress its own numbers, independent of the President's OMB.</li>
  <li><b>Budget resolution</b>: House and Senate Budget Committees set overall spending limits in a concurrent resolution (not signed by the President).</li>
  <li><b>Appropriations</b>: the Appropriations committees write 12 bills funding the government.</li>
  <li><b>October 1: the fiscal year begins.</b> If the bills aren't passed, Congress passes a <b>continuing resolution (CR)</b> to keep funding at current levels, or rolls everything into one <b>omnibus</b> bill.</li>
 </ol>
 <p>The <b>Congressional Budget and Impoundment Control Act of 1974</b> created this process, the CBO, and the Budget Committees. It was passed in response to Nixon's <b>impoundment</b> (refusal to spend) of money Congress had appropriated, and it limits the President's ability to do that.</p>

 <h3>Shutdowns, debt, and the debt ceiling</h3>
 <ul>
  <li><b>Government shutdown</b>: if appropriations or a CR lapse, non-essential operations stop. The <b>longest in history</b> ran <b>43 days, Oct. 1 – Nov. 12, 2025</b>, breaking the 35-day record from 2018–19.</li>
  <li><b>Deficit</b> = the gap between spending and revenue in one year. <b>Debt</b> = the total accumulated from all past deficits (now more than $38 trillion).</li>
  <li><b>Debt ceiling</b>: a statutory cap on total federal borrowing. It doesn't authorize new spending; it lets the Treasury pay for spending Congress already approved. Standoffs over raising it (2011, 2023) have threatened default. The One Big Beautiful Bill Act (2025) raised it by $5 trillion.</li>
 </ul>

 <h3>Reconciliation — the filibuster workaround</h3>
 <p><b>Budget reconciliation</b> is a fast-track process for bills that change spending, taxes, or the debt limit. Debate is limited to 20 hours, so it <b>can't be filibustered</b> and needs only a simple majority. The <b>Byrd Rule</b> limits it to provisions with a direct budget effect, and the Senate parliamentarian decides what qualifies. Major uses:</p>
 <ul>
  <li>Affordable Care Act fixes (Health Care and Education Reconciliation Act, 2010)</li>
  <li>Tax Cuts and Jobs Act (2017)</li>
  <li>American Rescue Plan (2021) and Inflation Reduction Act (2022). VP Kamala Harris broke ties on both.</li>
  <li><b>One Big Beautiful Bill Act</b> (signed July 4, 2025): tax cuts, Medicaid changes, and the debt-limit increase. Passed the Senate 51–50 with VP Vance's tiebreaker and the House 218–214.</li>
 </ul>

 <div class="trap">
  <div class="h">Where points get lost</div>
  <p><b>Deficit ≠ debt.</b> A deficit is one year's gap; the debt is the running total. "The deficit is $38 trillion" is wrong.</p>
  <p><b>Raising the debt ceiling doesn't increase spending.</b> It pays bills Congress already ran up.</p>
  <p><b>The President proposes; Congress disposes.</b> The President's budget has no legal force. Only appropriations passed by Congress can spend money.</p>
  <p><b>Entitlements are mandatory</b>, so cutting "wasteful discretionary spending" can't balance the budget on its own. The math doesn't work, and FRQs reward you for saying so.</p>
 </div>

 <div class="frq">
  <div class="h">FRQ language that scores (quantitative analysis)</div>
  <p>"The graph shows that <b>mandatory spending (61%)</b> makes up the largest share of federal outlays. This limits Congress's control over the budget because mandatory spending is <b>set by existing law and does not require annual appropriations</b>, so Congress can only adjust the <b>discretionary</b> portion (27%) through the yearly appropriations process."</p>
 </div>
 `,
 problems:[
  {kind:'Quantitative analysis',
   q:`Use the chart.${barChart({items:[{label:'1965',value:30},{label:'1985',value:44},{label:'2005',value:53},{label:'2024',value:61}],max:80,step:10,unit:'%',showVal:true,ylabel:'mandatory, % of outlays',caption:'Mandatory spending as a share of federal outlays (approx., CBO/OMB historical tables)'})}(A) Identify the share of spending that was mandatory in 1985. (B) Describe the trend. (C) Draw a conclusion about how the trend affects Congress's power of the purse. (D) Explain one reason for the trend.`,
   sol:`<ol>
    <li><b>(A)</b> Read the 1985 bar: about <b>44%</b>.</li>
    <li><b>(B)</b> Mandatory spending grew steadily as a share of outlays, from under a third in 1965 to about three-fifths in 2024.</li>
    <li><b>(C)</b> Congress's annual control over the budget has <b>shrunk</b>: a growing share is spent automatically under existing entitlement laws, leaving less discretionary money to allocate each year.</li>
    <li><b>(D)</b> Medicare and Medicaid were created in 1965 and grew with health costs; the aging baby-boom population draws more Social Security and Medicare; entitlement cuts are politically risky, so they rarely happen.</li></ol>
    <p>Scoring note: in (A), a number read from the chart is the whole point. Say "about 44%," not "less than half."</p>
    <div class="ans">~44% · rising trend · shrinking share of the budget Congress controls each year · aging population and health-care costs</div>`},

  {kind:'Vocabulary',
   q:'Match: (1) nonpartisan agency that scores bills (2) the President\'s budget office (3) keeps the government funded at current levels temporarily (4) a single bill combining many appropriations (5) Social Security and Medicare.',
   sol:`<ol><li>CBO</li><li>OMB</li><li>Continuing resolution</li><li>Omnibus bill</li><li>Entitlements (mandatory spending)</li></ol>
    <p>CBO works for Congress; OMB works for the President. MCQs deliberately swap them.</p>
    <div class="ans">CBO · OMB · CR · Omnibus · Entitlements</div>`},

  {kind:'Reconciliation',
   q:'The Senate has 52 majority-party members. Leaders want to pass a large tax cut that the minority opposes. Explain which procedure they would use, why, and one limitation.',
   sol:`<ol>
    <li>Use <b>budget reconciliation</b>: debate is capped at 20 hours, so it can't be filibustered and needs only a simple majority (51, or 50 + VP).</li>
    <li>52 is enough for reconciliation but not for the 60 votes cloture requires.</li>
    <li>Limitation: the <b>Byrd Rule</b>. Provisions must directly affect spending or revenue, and the parliamentarian can strip non-budgetary provisions. Reconciliation bills also can't add to deficits beyond the budget window, which is why the 2017 individual tax cuts were written to expire.</li></ol>
    <div class="ans">Reconciliation: simple majority, no filibuster. Limited by the Byrd Rule to budget-related provisions.</div>`},

  {kind:'Shutdown scenario',
   q:'It\'s September 30. None of the 12 appropriations bills have passed. Describe two things Congress can do, and what happens if it does neither.',
   sol:`<ol>
    <li>Pass a <b>continuing resolution</b> to fund the government temporarily at current levels.</li>
    <li>Pass an <b>omnibus</b> (all 12 bills in one) or a "minibus" (several).</li>
    <li>If neither passes and the President signs neither by midnight, funding lapses → <b>government shutdown</b>. Non-essential employees are furloughed; essential workers keep working without pay; mandatory programs like Social Security keep paying because they don't depend on annual appropriations.</li></ol>
    <p>Namedrop: the Oct. 1 – Nov. 12, 2025 shutdown lasted 43 days, the longest ever.</p>
    <div class="ans">CR or omnibus; otherwise a shutdown (mandatory spending continues).</div>`},

  {kind:'Pork & logrolling',
   q:'A representative trades her vote on a colleague\'s highway bill for his vote on funding for a veterans\' hospital in her district. Name both practices involved and explain how they relate to the incumbency advantage.',
   sol:`<ol>
    <li>The vote trade is <b>logrolling</b>.</li>
    <li>Money for a specific local project is <b>pork barrel spending</b> (delivered through an <b>earmark</b>).</li>
    <li>Link: bringing projects home lets the incumbent claim credit ("I got us the hospital"), which builds name recognition and constituent support and makes reelection more likely.</li></ol>
    <div class="ans">Logrolling + pork barrel; both let incumbents claim credit for local benefits, strengthening reelection chances.</div>`}
 ]
},

{
 id:'t47', num:'4.7', title:'Reapportionment & Redistricting',
 lede:'Every ten years the country is counted, House seats move between states, and every state redraws its lines. The Supreme Court spent the 1960s deciding that those lines had to treat each voter equally.',
 body:`
 <h3>Two processes: don't mix them up</h3>
 <div class="cards">
  <div class="card"><div class="k">Reapportionment</div><div class="v">Redistributing the <b>435 House seats among the states</b> after each census. Done by a formula at the federal level. Every state gets at least one seat.</div></div>
  <div class="card"><div class="k">Redistricting</div><div class="v">Redrawing <b>district lines within a state</b> after it learns how many seats it has. Usually done by the <b>state legislature</b>, sometimes by an independent commission or a court.</div></div>
 </div>

 <h3>Reapportionment mechanics</h3>
 <ul>
  <li>Article I, §2 requires an "actual enumeration" — the <b>census</b> — every 10 years. The last was 2020; the next is 2030.</li>
  <li>The <b>Reapportionment Act of 1929</b> (Permanent Apportionment Act) capped the House at <b>435</b>. The Census Bureau reports the counts, and seats are assigned automatically. Since 1941 the formula has been the "method of equal proportions" (Huntington–Hill).</li>
  <li>Because the total is fixed, it's zero-sum: one state's gain is another's loss. The long-term trend is seats shifting from the Northeast and Midwest (the "Rust Belt") to the South and West (the "Sun Belt").</li>
  <li>Six states have only one at-large seat: Alaska, Delaware, North Dakota, South Dakota, Vermont, and Wyoming. Montana regained a second seat in 2020.</li>
  <li>A seat change also changes a state's <b>Electoral College votes</b> (House seats + 2).</li>
 </ul>
 ${barChart({items:[{label:'TX',value:2},{label:'FL',value:1},{label:'CO',value:1},{label:'MT',value:1},{label:'NC',value:1},{label:'OR',value:1},{label:'CA',value:-1},{label:'IL',value:-1},{label:'MI',value:-1},{label:'NY',value:-1},{label:'OH',value:-1},{label:'PA',value:-1},{label:'WV',value:-1}],min:-2,max:3,step:1,signed:true,ylabel:'change in House seats',h:280,caption:'Reapportionment after the 2020 census · seats changed hands in 13 states (7 seats moved)'})}
 <p>California lost a seat for the first time in its history (53 → 52). Texas gained two (36 → 38), after gaining four in 2010.</p>

 <h3>Redistricting rules</h3>
 <ul>
  <li><b>Equal population: "one person, one vote."</b> Districts in a state must have nearly equal populations. <b>Malapportionment</b> (badly unequal districts) is unconstitutional.</li>
  <li><b>Contiguous</b>: every part of a district must connect.</li>
  <li><b>Can't discriminate by race</b>: the 14th and 15th Amendments and the <b>Voting Rights Act of 1965</b>.</li>
  <li>Many states add compactness and keeping counties and "communities of interest" together.</li>
  <li><b>Independent redistricting commissions</b> draw the lines in some states, including California (created by voters in 2008/2010), Arizona (upheld in <i>Arizona State Legislature v. Arizona Independent Redistricting Commission</i>, 2015), and Michigan (2018).</li>
 </ul>

 <h3>The one-person-one-vote cases</h3>
 <h4>Baker v. Carr (1962) — REQUIRED CASE</h4>
 <table>
  <tbody>
   <tr><td>Facts</td><td>Charles Baker, a Shelby County (Memphis) voter, sued Tennessee Secretary of State Joe Carr. Tennessee had <b>not redistricted its state legislature since 1901</b>, despite a state constitutional requirement to do so every 10 years. Cities had grown enormously, so a rural vote counted for far more than an urban one.</td></tr>
   <tr><td>Question</td><td>Can federal courts hear challenges to legislative apportionment, or is it a "political question" for the elected branches? Does the failure to redistrict violate the <b>Equal Protection Clause</b> of the 14th Amendment?</td></tr>
   <tr><td>Holding</td><td><b>6–2</b>, Justice William Brennan. Apportionment is <b>justiciable</b>: federal courts <b>can</b> hear these cases. The Court sent the case back without deciding whether Tennessee's map was unconstitutional.</td></tr>
   <tr><td>Reasoning</td><td>Equal protection is a constitutional right, and deciding whether it has been violated is a judicial job, not a "political question." Brennan set out a test for what counts as a political question. Justice Felix Frankfurter dissented, warning the Court was entering a "political thicket."</td></tr>
   <tr><td>Impact</td><td>Opened the door to <i>Wesberry</i> and <i>Reynolds</i>. Within about four years, nearly every state had redrawn its maps. Chief Justice Earl Warren called Baker the most important case of his tenure.</td></tr>
  </tbody>
 </table>
 <h4>Wesberry v. Sanders (1964)</h4>
 <p>Georgia's congressional districts were badly unequal (one Atlanta district had about three times the population of another). The Court held that congressional districts must be as equal in population "as nearly as is practicable." This applied <b>"one person, one vote"</b> to the <b>U.S. House</b>, grounding it in Article I, §2.</p>
 <h4>Reynolds v. Sims (1964)</h4>
 <p>Applied one person, one vote to <b>both houses of state legislatures</b> (Alabama), under the Equal Protection Clause. Chief Justice Warren wrote: "Legislators represent people, not trees or acres." States can't copy the U.S. Senate model with one senator per county.</p>

 <div class="trap">
  <div class="h">Where points get lost</div>
  <p><b>Baker v. Carr did NOT create "one person, one vote."</b> Baker only said courts <em>can hear</em> these cases (justiciability). Wesberry (congressional districts) and Reynolds (state legislatures) set the equal-population standard. Your class notes attribute it to Wesberry, which is correct.</p>
  <p><b>Reapportionment ≠ redistricting.</b> Reapportionment moves seats between states; redistricting draws lines inside a state.</p>
  <p><b>The U.S. Senate is exempt from one person, one vote.</b> Equal state representation is written into the Constitution (Article V even bars taking it away without a state's consent).</p>
 </div>

 <div class="frq">
  <div class="h">FRQ language that scores (SCOTUS comparison)</div>
  <p>"In <i>Baker v. Carr</i> (1962), the Court held that <b>redistricting is justiciable</b> because a claim that unequal districts violate the <b>Equal Protection Clause of the Fourteenth Amendment</b> is a constitutional question courts can decide, not a political question."</p>
 </div>
 `,
 problems:[
  {kind:'Read the chart',
   q:`Using the 2020 reapportionment chart above: (A) Identify the state that gained the most seats. (B) Describe the regional pattern in the changes. (C) Explain one political consequence for a state that loses a seat.`,
   sol:`<ol>
    <li><b>(A)</b> Texas, +2.</li>
    <li><b>(B)</b> Gains went to the South and West (TX, FL, NC, CO, MT, OR); losses came from the Northeast, Midwest, and California (NY, PA, OH, MI, IL, WV, CA). Population is moving to the Sun Belt.</li>
    <li><b>(C)</b> A state that loses a seat loses representation in the House <b>and</b> one Electoral College vote. It also has to redraw its map with fewer districts, which can force two incumbents to run against each other.</li></ol>
    <div class="ans">Texas · shift from Rust Belt/Northeast to Sun Belt · fewer House votes and electoral votes, incumbent-vs-incumbent races</div>`},

  {kind:'Required case',
   q:'Describe the facts, holding, and significance of <i>Baker v. Carr</i> (1962) in three sentences.',
   sol:`<ol>
    <li><b>Facts:</b> Tennessee hadn't redistricted its legislature since 1901, so urban voters like Charles Baker were badly underrepresented compared with rural voters.</li>
    <li><b>Holding:</b> In a 6–2 decision by Justice Brennan, the Court ruled that apportionment challenges are justiciable. They raise an Equal Protection question, not a "political question," so federal courts can hear them.</li>
    <li><b>Significance:</b> It opened the courts to redistricting cases, leading directly to one person, one vote in <i>Wesberry v. Sanders</i> and <i>Reynolds v. Sims</i> (1964) and to nationwide redistricting.</li></ol>
    <div class="ans">Tennessee malapportionment → courts CAN hear redistricting cases (14th Amendment Equal Protection) → one person, one vote.</div>`},

  {kind:'Case matching',
   q:'Match each case to its principle: (1) Baker v. Carr (2) Wesberry v. Sanders (3) Reynolds v. Sims. Principles: (a) state legislative districts must be equal in population (b) courts may hear apportionment cases (c) congressional districts must be equal in population.',
   sol:`<ol><li>Baker → (b) justiciability</li><li>Wesberry → (c) U.S. House districts</li><li>Reynolds → (a) state legislatures ("people, not trees or acres")</li></ol>
    <div class="ans">1-b, 2-c, 3-a</div>`},

  {kind:'Process distinction',
   q:'After the 2020 census, Texas went from 36 to 38 seats and then drew a new map. Label each step as reapportionment or redistricting, and name who performed it.',
   sol:`<ol>
    <li>36 → 38 seats: <b>reapportionment</b>. The federal formula applied to Census Bureau counts; Texas received its seats automatically.</li>
    <li>Drawing the 38 districts: <b>redistricting</b>. Done by the Texas state legislature (which redrew them again mid-decade in 2025).</li></ol>
    <div class="ans">Seat change = reapportionment (federal/census). New lines = redistricting (state legislature).</div>`},

  {kind:'Malapportionment',
   q:'State X has two congressional districts: District 1 has 1,000,000 people and District 2 has 500,000. Explain why this is unconstitutional and which case you would cite.',
   sol:`<ol>
    <li>A voter in District 2 has twice the influence of a voter in District 1, because each representative stands for half as many people.</li>
    <li><b>Wesberry v. Sanders (1964)</b> requires congressional districts to be as equal in population "as nearly as is practicable" — one person, one vote.</li>
    <li>You'd get into court under <b>Baker v. Carr</b>, which makes the claim justiciable.</li></ol>
    <div class="ans">It dilutes District 1 votes by half; it violates one person, one vote (Wesberry v. Sanders), and Baker v. Carr lets courts hear the case.</div>`}
 ]
},

/* ---------------------------------------------------------- 4.8 */
{
 id:'t48', num:'4.8', title:'Gerrymandering & the Courts',
 lede:'The map-drawer can decide an election before anyone votes. Courts police racial gerrymanders but have left partisan ones to the states, and since 2025 that choice has set off a nationwide redistricting war.',
 body:`
 <h3>What it is</h3>
 <p><b>Gerrymandering</b> is drawing district lines to give one party or group an unfair advantage. It's usually visible in oddly shaped districts. The name comes from Massachusetts Gov. <b>Elbridge Gerry</b>, who signed an 1812 map with a district shaped like a salamander. A cartoonist called it a "Gerry-mander."</p>

 <h3>Packing and cracking</h3>
 ${gerry({grid:['DDDRR','DDDRR','DDDRR','DDDRR','DDDRR'],districts:['12345','12345','12345','12345','12345'],caption:'A 25-voter state · 15 D (60%), 10 R (40%) · five column districts → D wins 3, R wins 2 (proportional)'})}
 <div class="cards">
  <div class="card"><div class="k">Packing</div><div class="v">Concentrate the other party's voters into <b>as few districts as possible</b>. They win those by huge margins and "waste" the extra votes, leaving the remaining districts to you.</div></div>
  <div class="card"><div class="k">Cracking</div><div class="v"><b>Split</b> the other party's voters across many districts so they're a minority in each and win nowhere.</div></div>
 </div>
 <p>The same 60/40 electorate can produce a 5–0, 3–2, or 2–3 result depending only on where the lines go. See the practice problems.</p>

 <h3>Consequences</h3>
 <ul>
  <li>Elected officials don't necessarily reflect the state's actual partisan split.</li>
  <li>More <b>safe seats</b>, so the real contest moves to the <b>primary</b>. Primary voters are more ideological, which pushes members to the extremes and increases <b>polarization</b>.</li>
  <li>Protects <b>incumbents</b> and discourages challengers.</li>
  <li>Can dilute <b>minority representation</b> (cracking minority communities), or concentrate it.</li>
 </ul>

 <h3>Race: Shaw v. Reno (1993) — REQUIRED CASE</h3>
 <table>
  <tbody>
   <tr><td>Background</td><td>The <b>Voting Rights Act of 1965</b> banned discriminatory voting practices (literacy tests, etc.). Section 5 <b>preclearance</b> required states with a history of discrimination to get federal approval for voting changes. <i>Thornburg v. Gingles</i> (1986) read Section 2 to require <b>majority-minority districts</b> when a minority group is large and compact and voting is racially polarized.</td></tr>
   <tr><td>Facts</td><td>After the 1990 census, the Justice Department (Attorney General <b>Janet Reno</b>) pushed North Carolina to draw a second majority-Black district. The new <b>12th District</b> snaked about 160 miles along Interstate 85, in places no wider than the highway. White voters led by <b>Ruth Shaw</b> sued.</td></tr>
   <tr><td>Question</td><td>Does a redistricting plan drawn primarily on the basis of race violate the <b>Equal Protection Clause of the 14th Amendment</b>?</td></tr>
   <tr><td>Holding</td><td><b>5–4</b>, Justice Sandra Day O'Connor. A district so irregular that it can only be explained by race must face <b>strict scrutiny</b>. The case was sent back to the lower court. (In <i>Shaw v. Hunt</i>, 1996, the district was struck down.)</td></tr>
   <tr><td>Reasoning</td><td>Race-based districting, even to help a minority group, classifies citizens by race. O'Connor wrote that the map "bears an uncomfortable resemblance to political <b>apartheid</b>." It must be narrowly tailored to a compelling government interest.</td></tr>
   <tr><td>Impact</td><td>Race can be considered, but it can't be the <b>predominant factor</b> (confirmed in <i>Miller v. Johnson</i>, 1995). Courts still cite Shaw for racial gerrymandering claims, and the tension between the VRA and equal protection runs through <i>Louisiana v. Callais</i> (2026).</td></tr>
  </tbody>
 </table>

 <h3>Party: Rucho v. Common Cause (2019)</h3>
 <p>Challenges to partisan maps in North Carolina (drawn to favor Republicans) and Maryland (drawn to favor Democrats). <b>5–4, Chief Justice Roberts: partisan gerrymandering claims are nonjusticiable political questions</b> in federal court, because there's no manageable standard for "too partisan." State courts and state constitutions, independent commissions, and Congress can still act. <b>Contrast with Baker v. Carr:</b> Baker opened federal courts to malapportionment; Rucho closed them to partisan gerrymandering.</p>

 <h3>The Voting Rights Act after 2013</h3>
 <ul>
  <li><b>Shelby County v. Holder (2013)</b>: struck down the Section 4(b) coverage formula. That ended Section 5 preclearance in practice.</li>
  <li><b>Allen v. Milligan (2023)</b>: 5–4, Roberts. Upheld Section 2 and required Alabama to draw a second majority-Black district.</li>
  <li><b>Alexander v. South Carolina NAACP (2024)</b>: courts must presume legislatures acted in good faith. "We drew it for party, not race" became a strong defense.</li>
  <li><b>Louisiana v. Callais (April 29, 2026)</b>: <b>6–3</b>, Justice Samuel Alito. Struck down Louisiana's second majority-Black district as an unconstitutional racial gerrymander and made Section 2 vote-dilution claims much harder to win (plaintiffs must show something close to intentional discrimination). Justice Elena Kagan dissented. It didn't formally overrule Allen v. Milligan, but it sharply weakened it.</li>
 </ul>

 <h3>The mid-decade redistricting war (2025–26)</h3>
 <p>States normally redraw once per decade. Starting in 2025, they began redrawing mid-decade to gain an edge in the 2026 midterms:</p>
 <ul>
  <li><b>Texas (Aug. 2025)</b>: at President Trump's urging, a new map aimed at <b>+5 Republican seats</b>. Texas House Democrats fled the state to deny a quorum, which delayed but didn't stop the map. A lower court found it a racial gerrymander, but the Supreme Court let it be used for 2026.</li>
  <li><b>California, Prop 50 (Nov. 4, 2025)</b>: voters approved it about 64%–36%. It temporarily replaced the independent commission's congressional map with one aimed at <b>+5 Democratic seats</b>, a direct response to Texas.</li>
  <li>Others: Missouri, North Carolina, and Ohio (Republican gains); Utah (a court-ordered map with a new Democratic-leaning seat). After Callais, Florida, Tennessee, Louisiana, and Alabama redrew again. Virginia's attempt was struck down.</li>
 </ul>
 <p>This is a live example of every concept in this section: packing and cracking, Rucho leaving partisan maps to the states, Shaw and Callais on race, and commissions versus legislatures.</p>

 <div class="trap">
  <div class="h">Where points get lost</div>
  <p><b>Shaw is about RACE; Rucho is about PARTY.</b> Racial gerrymanders get strict scrutiny in federal court; partisan gerrymanders are political questions federal courts won't hear.</p>
  <p><b>Shaw didn't ban considering race.</b> It held that race can't be the <em>predominant</em> factor without passing strict scrutiny.</p>
  <p><b>Shaw's plaintiffs won, but the Court didn't strike the map itself in 1993.</b> It sent the case back. The district fell in <i>Shaw v. Hunt</i> (1996).</p>
  <p><b>Both required cases rest on the 14th Amendment's Equal Protection Clause.</b> That's the link for any SCOTUS-comparison FRQ.</p>
 </div>

 <div class="frq">
  <div class="h">FRQ language that scores (SCOTUS comparison)</div>
  <p>"Both <i>Shaw v. Reno</i> and [non-required case] involve the <b>Equal Protection Clause of the Fourteenth Amendment</b> because in each, the plaintiffs argued that district lines [classified voters by race / diluted their votes]. In <i>Shaw</i>, the Court held that districts drawn <b>predominantly on the basis of race</b> are subject to <b>strict scrutiny</b>…"</p>
 </div>
 `,
 problems:[
  {kind:'Read the map',
   q:`Same 25 voters (15 D, 10 R), new lines. Thick borders mark districts.${gerry({grid:['DDDRR','DDDRR','DDDRR','DDDRR','DDDRR'],districts:['45111','45121','45222','45233','45333'],caption:'Map drawn by the state legislature'})}(A) How many districts does each party win? (B) Identify the technique used against Democrats in the two left-hand districts. (C) Which party most likely drew this map?`,
   sol:`<ol>
    <li>Count each district (5 voters each):
    <div class="work">District 1 (top right):     R R R + D D  → R wins 3–2
District 2 (middle):        R R R + D D  → R wins 3–2
District 3 (bottom right):  R R R R + D  → R wins 4–1
District 4 (column 1):      D D D D D    → D wins 5–0
District 5 (column 2):      D D D D D    → D wins 5–0</div></li>
    <li><b>(A)</b> R wins 3, D wins 2 — with only 40% of the vote.</li>
    <li><b>(B)</b> <b>Packing</b>. Ten Democrats are crammed into two districts they win 5–0, wasting six votes that would have been decisive elsewhere.</li>
    <li><b>(C)</b> Republicans. The minority party turned 40% of the vote into 60% of the seats.</li></ol>
    <p>Sanity check: in a gerrymander, the winning side wins its seats narrowly (3–2) and the losing side wins big (5–0). Lopsided wins for one party are the telltale sign of packing.</p>
    <div class="ans">R 3, D 2 · Democrats packed into columns 1–2 · a Republican gerrymander</div>`},

  {kind:'Cracking',
   q:`Now the districts are the five rows.${gerry({grid:['DDDRR','DDDRR','DDDRR','DDDRR','DDDRR'],districts:['11111','22222','33333','44444','55555'],caption:'Horizontal districts'})}How many seats does each party win, and what technique does this illustrate?`,
   sol:`<ol>
    <li>Each row: 3 D, 2 R → D wins every district 3–2.</li>
    <li>Result: <b>D 5, R 0</b>, even though Republicans are 40% of voters.</li>
    <li>Republican voters are <b>cracked</b>: spread evenly so they're a losing minority in every district.</li></ol>
    <div class="ans">D 5 – R 0 · cracking</div>`},

  {kind:'Required case',
   q:'Summarize the facts, constitutional question, holding, and reasoning of <i>Shaw v. Reno</i> (1993).',
   sol:`<ol>
    <li><b>Facts:</b> After the 1990 census, North Carolina, under Justice Department pressure to comply with the Voting Rights Act, created a second majority-Black district: the 12th, a roughly 160-mile snake along I-85.</li>
    <li><b>Question:</b> Does a district drawn primarily on the basis of race violate the Equal Protection Clause of the 14th Amendment?</li>
    <li><b>Holding:</b> 5–4 (O'Connor). A plan that can only be explained as separating voters by race is subject to <b>strict scrutiny</b>. The case was sent back to the lower court.</li>
    <li><b>Reasoning:</b> Racial classifications are presumptively unconstitutional even when intended to help minorities. The district's bizarre shape suggested race was the predominant motive, which O'Connor compared to "political apartheid."</li></ol>
    <div class="ans">Race-predominant districts trigger strict scrutiny under the 14th Amendment's Equal Protection Clause.</div>`},

  {kind:'SCOTUS comparison',
   q:`<p><b>Non-required case:</b> In <i>Rucho v. Common Cause</i> (2019), voters challenged North Carolina's congressional map, which legislators openly admitted was drawn to elect 10 Republicans and 3 Democrats. The plaintiffs argued it violated the Equal Protection Clause and the First Amendment. In a 5–4 decision, the Court held that partisan gerrymandering claims present political questions beyond the reach of federal courts.</p><p>(A) Identify the constitutional clause relevant to both <i>Rucho</i> and <i>Baker v. Carr</i>. (B) Explain why the holdings differ. (C) Explain how opponents of partisan gerrymandering could respond to <i>Rucho</i>.</p>`,
   sol:`<ol>
    <li><b>(A)</b> The Equal Protection Clause of the 14th Amendment.</li>
    <li><b>(B)</b> In <i>Baker</i>, the Court found malapportionment <b>justiciable</b> because population equality gives courts a clear, manageable standard. In <i>Rucho</i>, the Court found there is <b>no judicially manageable standard</b> for how much partisanship is too much, so it treated the issue as a political question for elected branches.</li>
    <li><b>(C)</b> Sue in <b>state courts</b> under state constitutions; use ballot initiatives to create <b>independent redistricting commissions</b> (as in California and Michigan); or lobby <b>Congress</b> to pass a law regulating congressional redistricting (Article I, §4, the Elections Clause).</li></ol>
    <div class="ans">(A) Equal Protection. (B) Baker had a clear standard (population); Rucho found none for partisanship → political question. (C) State courts, commissions, or congressional legislation.</div>`},

  {kind:'Current events',
   q:'Explain how the 2025–26 mid-decade redistricting battles (Texas, California\'s Prop 50) illustrate the consequences of <i>Rucho v. Common Cause</i>.',
   sol:`<ol>
    <li>Rucho closed the federal courts to <b>partisan</b> gerrymandering claims.</li>
    <li>With no federal referee, parties escalated. Texas redrew mid-decade to target five more Republican seats, and California voters responded with Prop 50 to target five more Democratic seats. Other states followed.</li>
    <li>The only remaining checks were political (voters, ballot measures, quorum-breaking walkouts) and state law. That's exactly the path Rucho pointed to.</li></ol>
    <div class="ans">Without federal-court review of partisan maps, states engaged in tit-for-tat redistricting checked only by state law and voters.</div>`},

  {kind:'Race vs. party',
   q:'A legislature draws a district that is 70% Black. Challengers call it a racial gerrymander. Legislators say they drew it to pack Democrats, who happen to be mostly Black in that area. Which cases matter, and why does the legislature\'s explanation matter?',
   sol:`<ol>
    <li>If race was the <b>predominant</b> factor, <b>Shaw v. Reno</b> applies: strict scrutiny, and the map probably fails.</li>
    <li>If it was drawn for <b>partisan</b> reasons, <b>Rucho</b> means federal courts won't review it.</li>
    <li><b>Alexander v. South Carolina NAACP (2024)</b> requires courts to presume legislative good faith and untangle race from party, which makes the partisan defense powerful.</li></ol>
    <div class="ans">Shaw (race → strict scrutiny) vs. Rucho (party → nonjusticiable). Alexander (2024) makes the partisan explanation hard to overcome.</div>`}
 ]
},

/* ---------------------------------------------------------- 4.9 */
{
 id:'t49', num:'4.9', title:'Congressional Behavior & Representation',
 lede:'Members of Congress want to be reelected, want to make good policy, and want power in the chamber, in roughly that order. This section covers how those goals collide with party pressure and a divided electorate.',
 body:`
 <h3>Models of representation</h3>
 <table>
  <thead><tr><th>Model</th><th>Votes based on…</th><th>Link to the Constitution</th></tr></thead>
  <tbody>
   <tr><td>Delegate</td><td>What constituents want, even against their own judgment</td><td>Fits House members' 2-year terms and the Anti-Federalist ideal of representatives who mirror the people (Brutus No. 1)</td></tr>
   <tr><td>Trustee</td><td>Their own judgment of the public good, even against constituent opinion. Coined by <b>Edmund Burke</b> (1774).</td><td>Fits Senate 6-year terms and <b>Federalist No. 10</b>: representatives "refine and enlarge the public views"</td></tr>
   <tr><td>Politico</td><td>A blend: a delegate on issues constituents care about, a trustee on the rest</td><td>What most members actually do</td></tr>
   <tr><td>Partisan</td><td>What party leadership wants</td><td>Dominant today; party-line voting is at record highs</td></tr>
  </tbody>
 </table>
 <p>Related distinction: <b>descriptive representation</b> (members who look like their constituents in race, gender, and background) versus <b>substantive representation</b> (members who advance their constituents' interests). Congress is more diverse than ever but still older, whiter, more male, and much wealthier than the country, and a large share of members are lawyers.</p>

 <h3>Polarization and gridlock</h3>
 <ul>
  <li><b>Polarization</b>: the parties have moved apart ideologically, and the overlap between the most liberal Republican and the most conservative Democrat has essentially disappeared. Political scientists measure this with <b>DW-NOMINATE</b> scores.</li>
  <li><b>Causes</b>: gerrymandered safe seats and primaries, geographic sorting (people living near like-minded people), partisan media, and the decline of conservative Southern Democrats and liberal Northeastern Republicans.</li>
  <li><b>Gridlock</b>: the inability to pass legislation. It's worse under <b>divided government</b> (different parties controlling the presidency and at least one chamber), but the filibuster produces gridlock even under unified government.</li>
  <li><b>Lame-duck</b> sessions (after the November election, before the new Congress in January) often see rushed deals because defeated or retiring members have nothing to lose.</li>
  <li>Effects: shutdowns, reliance on CRs and omnibus bills, more <b>executive orders</b> as presidents route around Congress, and <b>party-line confirmations</b>.</li>
 </ul>

 <h3>The incumbency advantage</h3>
 ${lineChart({x:['2014','2016','2018','2020','2022','2024'],series:[{name:'House',values:[95,97,91,95,94,96],color:'#1f3a68'},{name:'Senate',values:[82,93,84,84,100,90],color:'#a33327',dash:true}],min:70,max:100,step:5,unit:'%',ylabel:'incumbents reelected',caption:'Illustrative data for practice · modeled on typical reelection rates of incumbents seeking reelection'})}
 <p>House incumbents who run again win more than 90% of the time. Senate rates are high but more volatile: statewide races draw stronger challengers, more media coverage, and more competitive electorates. Why incumbents win:</p>
 <div class="cards">
  <div class="card"><div class="k">Name recognition</div><div class="v">Years of media coverage and mailers. Challengers start as unknowns.</div></div>
  <div class="card"><div class="k">Casework</div><div class="v">Staff help constituents with problems like lost Social Security checks or passport delays. It's nonpartisan goodwill that wins votes.</div></div>
  <div class="card"><div class="k">Franking privilege</div><div class="v">Free official mail to constituents (restricted near elections).</div></div>
  <div class="card"><div class="k">Credit claiming</div><div class="v">Pork, earmarks, and grants brought home to the district.</div></div>
  <div class="card"><div class="k">Fundraising</div><div class="v">PACs and interest groups give to likely winners, and incumbents usually outraise challengers by wide margins.</div></div>
  <div class="card"><div class="k">Redistricting</div><div class="v">Safe seats drawn by friendly legislatures.</div></div>
 </div>
 <p><b>Fenno's paradox</b> (political scientist Richard Fenno): Americans hate Congress but love their own member. Congressional approval has hovered around 20% or lower for years, while incumbents keep getting reelected. Voters blame the institution and credit their own representative.</p>

 <h3>Other behavior terms</h3>
 <ul>
  <li><b>Constituency</b>: the people a member represents. <b>Constituent service</b> = casework.</li>
  <li><b>Party-line vote</b>: most of one party votes against most of the other.</li>
  <li><b>Caucus</b> (also a group like the Congressional Black Caucus or the House Freedom Caucus): members who organize around shared interests or ideology.</li>
  <li><b>Oversight</b> is more aggressive under divided government, when the opposing party controls committees and investigates the President.</li>
 </ul>

 <div class="trap">
  <div class="h">Where points get lost</div>
  <p><b>Trustee vs. delegate is backwards in half of student answers.</b> A <b>D</b>elegate <b>D</b>oes what the district says; a <b>T</b>rustee <b>T</b>rusts their own judgment.</p>
  <p><b>Divided government ≠ polarization.</b> Divided government is about which party controls which branch. Polarization is about ideological distance between the parties. Each makes gridlock worse, but they're different things.</p>
  <p><b>Incumbency advantage is about individual members, not parties.</b> A party can lose its majority while 90%+ of incumbents are still reelected.</p>
 </div>

 <div class="frq">
  <div class="h">FRQ language that scores</div>
  <p>"Because the member is acting as a <b>trustee</b>, she voted based on her own judgment of the national interest rather than constituent preferences, which could <b>hurt her reelection chances</b> if her district's voters opposed the bill."</p>
 </div>
 `,
 problems:[
  {kind:'Quantitative analysis',
   q:`Use the incumbency chart above. (A) Identify the year with the lowest House reelection rate. (B) Describe a difference between House and Senate reelection rates. (C) Explain one reason for that difference. (D) Explain how the pattern relates to the incumbency advantage.`,
   sol:`<ol>
    <li><b>(A)</b> 2018 (≈91%).</li>
    <li><b>(B)</b> The House rate is consistently high (91–97%) and stable; the Senate rate is lower in most years and swings more (82% to 100%).</li>
    <li><b>(C)</b> Senators represent whole states, which are more diverse and harder to gerrymander than House districts; Senate races draw well-funded, well-known challengers (often governors or House members); and they get more media attention.</li>
    <li><b>(D)</b> Both chambers show reelection rates far above 50%, which reflects advantages like name recognition, casework, and fundraising. The advantage is stronger in the House, where districts are smaller and often drawn as safe seats.</li></ol>
    <div class="ans">2018 · House higher and steadier · statewide races are more competitive · strong incumbency advantage, stronger in the House</div>`},

  {kind:'Trustee or delegate',
   q:'Classify each: (1) A senator votes for a trade deal her state\'s voters oppose because she believes it helps the economy long-term. (2) A representative polls his district and votes the way 60% of respondents want. (3) A member follows her district on farm issues but her own judgment on foreign policy.',
   sol:`<ol><li>Trustee</li><li>Delegate</li><li>Politico</li></ol>
    <div class="ans">Trustee · Delegate · Politico</div>`},

  {kind:'Concept application',
   q:`<p>From 2011 to 2017, President Obama faced a Republican House (and, after 2015, a Republican Senate). The 2011 debt-ceiling standoff led to the first-ever downgrade of the U.S. credit rating, and a 16-day government shutdown followed in 2013.</p><p>(A) Identify the term for different parties controlling the presidency and Congress. (B) Explain how this condition contributed to the events described. (C) Describe one action a president might take in response.</p>`,
   sol:`<ol>
    <li><b>(A)</b> Divided government.</li>
    <li><b>(B)</b> Under divided government, the opposing party controls at least one chamber's agenda and can use must-pass legislation (the debt ceiling, appropriations) as leverage. With polarized parties unwilling to compromise, standoffs lead to <b>gridlock</b>, shutdowns, and brinkmanship.</li>
    <li><b>(C)</b> The president can use <b>executive orders</b> or executive actions (like Obama's DACA in 2012), use the <b>bully pulpit</b> to pressure Congress through public opinion, or <b>veto</b> opposition bills.</li></ol>
    <div class="ans">Divided government → gridlock and brinkmanship → president turns to executive orders, bully pulpit, and vetoes.</div>`},

  {kind:'Fenno\'s paradox',
   q:'Congressional approval is around 20%, yet more than 90% of House incumbents who seek reelection win. Explain this apparent contradiction.',
   sol:`<ol>
    <li>Voters judge Congress as an institution (gridlock, partisanship, scandal) but judge their own member individually.</li>
    <li>Individual members build personal support through casework, pork, and name recognition, and they often campaign by running <em>against</em> Congress.</li>
    <li>Safe districts and weak challengers mean unhappy voters often have no real alternative.</li></ol>
    <div class="ans">Fenno's paradox: people blame the institution but reward their own member's service, visibility, and district benefits.</div>`},

  {kind:'Polarization causes',
   q:'Explain how gerrymandering contributes to polarization in Congress.',
   sol:`<ol>
    <li>Gerrymandering creates <b>safe seats</b> where one party is certain to win the general election.</li>
    <li>The only real threat is a <b>primary challenge</b>, and primary voters are fewer and more ideological.</li>
    <li>Members therefore move toward their party's base and avoid compromise. Being "primaried" from the flank is the risk they fear most.</li>
    <li>With fewer moderates, the parties drift apart and bipartisan deals get rarer.</li></ol>
    <div class="ans">Safe seats → primaries matter most → members cater to ideological bases → more polarization.</div>`}
 ]
},

{

 <h3>The numbers</h3>

 <div class="eq"><div class="f">2/3 = 290 House · 67 Senate</div><div class="n">Veto override (both chambers) · proposing amendments (both) · convicting impeached officials (Senate) · ratifying treaties (Senate)</div></div>
 <div class="eq"><div class="f">2 yr / 25 / 7 &nbsp;·&nbsp; 6 yr / 30 / 9</div><div class="n">House: term / minimum age / years a citizen · Senate: term / minimum age / years a citizen</div></div>
 <div class="eq"><div class="f">10 days (Sundays excepted)</div><div class="n">President's window: sign, veto, or do nothing (law if in session; pocket veto if Congress adjourns)</div></div>

 <div class="eq"><div class="f">Oct 1 · 12 bills · ~61 / 27 / 13 %</div><div class="n">Fiscal year start · annual appropriations bills · mandatory / discretionary / interest share of FY2024 outlays</div></div>

 <h3>Case bank</h3>
 <table>
  <thead><tr><th>Case</th><th>Year · vote</th><th>One-line holding</th></tr></thead>
  <tbody>
   <tr><td>McCulloch v. Maryland</td><td>1819 · 7–0</td><td>Necessary and Proper → implied powers (national bank); federal law is supreme, so states can't tax it</td></tr>

   <tr><td>Wesberry v. Sanders</td><td>1964</td><td>One person, one vote for U.S. House districts</td></tr>

   <tr><td>INS v. Chadha</td><td>1983</td><td>The one-chamber "legislative veto" is unconstitutional (bicameralism and presentment)</td></tr>
   <tr><td>Shaw v. Reno ★</td><td>1993 · 5–4</td><td>Districts drawn predominantly by race face strict scrutiny (Equal Protection)</td></tr>

   <tr><td>Shelby County v. Holder</td><td>2013 · 5–4</td><td>VRA coverage formula struck down → preclearance ends</td></tr>
   <tr><td>Rucho v. Common Cause</td><td>2019 · 5–4</td><td>Partisan gerrymandering is a nonjusticiable political question in federal court</td></tr>
   <tr><td>Allen v. Milligan</td><td>2023 · 5–4</td><td>Upheld VRA §2; Alabama must draw a 2nd majority-Black district</td></tr>

  </tbody>
 </table>
 <p>★ = required Supreme Court case on the AP exam.</p>

 <h3>The four FRQ types, condensed</h3>
 <div class="cards">
  <div class="card"><div class="k">1 · Concept application</div><div class="v">A scenario. Describe a concept, explain how it applies, explain a consequence. Always link the concept to the <b>specific actor in the prompt</b>.</div></div>
  <div class="card"><div class="k">2 · Quantitative analysis</div><div class="v">Identify a data point (give the number), describe a trend, draw a conclusion, then explain the link to a political principle or institution.</div></div>
  <div class="card"><div class="k">3 · SCOTUS comparison</div><div class="v">A required case + a new case. Identify the shared clause (usually the 14th Amendment's Equal Protection Clause for this chapter), explain why the outcomes are similar or different, and describe a response.</div></div>
  <div class="card"><div class="k">4 · Argument essay</div><div class="v">Defensible thesis with a line of reasoning, two pieces of evidence (one from a foundational document), reasoning linking each, and a response to an opposing view (concede/refute/rebut).</div></div>
 </div>

 <h3>Memorize cold</h3>
 <ul>
  <li>House only: revenue bills, impeachment, choosing the President. Senate only: trying impeachments, confirmations, treaties, choosing the VP.</li>
  <li>Committee types: standing (permanent, lawmaking), select (investigate), joint (both chambers), conference (reconcile a bill).</li>
  <li>House Rules Committee = traffic cop (open/closed rule). Senate = unanimous consent, holds, filibuster/cloture.</li>
  <li>Leaders: Speaker Johnson, Majority Leader Scalise, Minority Leader Jeffries; Senate Majority Leader Thune, Minority Leader Schumer, President pro tem Grassley, VP Vance.</li>
  <li>Succession: VP → Speaker → President pro tem → Secretary of State.</li>
  <li>Packing (concentrate) vs. cracking (split). Shaw = race; Rucho = party.</li>
  <li>Mandatory (entitlements, automatic) vs. discretionary (12 appropriations bills).</li>
  <li>Delegate (constituents) · trustee (own judgment, Burke) · politico (mix).</li>
 </ul>

 <div class="frq">
  <div class="h">The highest-value sentence in this chapter</div>
  <p>"Because [structural feature — Senate filibuster / House Rules Committee / committee chairs from the majority / six-year terms], [actor] is able to [action], which makes it [more/less] likely that [policy outcome] because [link to majority power, minority rights, or responsiveness]."</p>
 </div>

 <h3>Vocabulary that has to be exact</h3>
 <table>
  <thead><tr><th>Don't write</th><th>Write instead</th></tr></thead>
  <tbody>
   <tr><td>"The Senate impeaches"</td><td>"The House impeaches; the Senate tries and can convict with 2/3"</td></tr>
   <tr><td>"Filibuster needs 60 votes"</td><td>"<b>Cloture</b> requires 60 votes to end a filibuster"</td></tr>
   <tr><td>"Baker v. Carr established one person, one vote"</td><td>"Baker made redistricting justiciable; Wesberry and Reynolds established one person, one vote"</td></tr>
   <tr><td>"Shaw banned using race"</td><td>"Shaw held that race-predominant districts face strict scrutiny"</td></tr>
   <tr><td>"Gerrymandering is illegal"</td><td>"Racial gerrymandering is unconstitutional; partisan gerrymandering is nonjusticiable in federal court (Rucho)"</td></tr>
   <tr><td>"The deficit is the total the government owes"</td><td>"The debt is the total; the deficit is one year's shortfall"</td></tr>
   <tr><td>"The President makes the budget"</td><td>"The President proposes a budget; Congress appropriates funds"</td></tr>
   <tr><td>"The VP runs the Senate"</td><td>"The Majority Leader controls the Senate floor; the VP only breaks ties"</td></tr>
   <tr><td>"Elastic clause = Commerce Clause"</td><td>"Elastic clause = Necessary and Proper Clause"</td></tr>
  </tbody>
 </table>
 `,
 problems:[
  {kind:'Cumulative · Concept application',
   q:`<p>In 2025, a group of senators introduced a bill to require independent commissions to draw congressional districts in every state. The bill has 55 cosponsors in the Senate. In the House, the chair of the relevant committee has refused to schedule a hearing, and the Speaker opposes the bill.</p><p>(A) Describe one power of House committee chairs that is relevant to this scenario. (B) Explain how supporters in the House could get the bill to the floor anyway, and why that is difficult. (C) Explain how Senate procedure could prevent the bill from passing even with 55 supporters. (D) Explain how passing this bill would affect the consequences of <i>Rucho v. Common Cause</i>.</p>`,
   sol:`<ol>
    <li><b>(A)</b> Chairs control the committee agenda: they decide whether to hold hearings and markups. Refusing to schedule the bill <b>pigeonholes</b> it.</li>
    <li><b>(B)</b> A <b>discharge petition</b> with 218 signatures forces the bill to the floor. It's hard because majority-party members rarely defy the Speaker, who controls committee assignments and party resources.</li>
    <li><b>(C)</b> Opponents can <b>filibuster</b>. Ending debate requires <b>cloture</b> (60 votes); 55 is five short. The bill can't use reconciliation because it isn't a budget measure.</li>
    <li><b>(D)</b> Rucho left partisan gerrymandering to states and Congress. A federal law under the Elections Clause (Art. I, §4) would do exactly what Rucho invited, replacing state-by-state partisan mapmaking with national rules and limiting the mid-decade redistricting wars.</li></ol>
    <div class="ans">Chair pigeonholes · discharge petition (218), hard because members won't defy leadership · filibuster, 55 &lt; 60 for cloture · Congress would fill the gap Rucho left.</div>`},

  {kind:'Cumulative · SCOTUS comparison',
   q:`<p><b>Non-required case:</b> <i>Reynolds v. Sims</i> (1964). Alabama's state senate gave each county one senator regardless of population, so a county of about 15,000 had the same representation as one with over 600,000. Voters sued, arguing this violated the Equal Protection Clause. The Court ruled 8–1 that both houses of a state legislature must be apportioned by population.</p><p>(A) Identify the constitutional clause common to <i>Reynolds v. Sims</i> and <i>Baker v. Carr</i>. (B) Explain how the holding in <i>Baker v. Carr</i> made the decision in <i>Reynolds</i> possible. (C) Explain why the reasoning in <i>Reynolds</i> does not apply to the U.S. Senate.</p>`,
   sol:`<ol>
    <li><b>(A)</b> The Equal Protection Clause of the 14th Amendment.</li>
    <li><b>(B)</b> Before <i>Baker</i>, federal courts treated apportionment as a nonjusticiable political question and wouldn't hear such cases. <i>Baker</i> held that apportionment claims are justiciable under Equal Protection, which let the Court reach the merits in <i>Reynolds</i> and require population-based districts.</li>
    <li><b>(C)</b> Equal state representation in the U.S. Senate is written into the Constitution itself (Article I and Article V, from the Great Compromise). A constitutional provision can't violate another part of the Constitution. Counties, by contrast, are just subdivisions of a state, not sovereign units, so they have no claim to equal representation.</li></ol>
    <div class="ans">(A) Equal Protection. (B) Baker made the issue justiciable, opening the door to Reynolds. (C) The Constitution itself guarantees two senators per state.</div>`},

  {kind:'Cumulative · Argument essay',
   q:`<p>Develop an argument that explains whether members of Congress should act primarily as <b>trustees</b> or as <b>delegates</b>.</p><p>Use at least one piece of evidence from: Federalist No. 10, Federalist No. 51, Brutus No. 1, or the U.S. Constitution. Use a second piece of evidence from another listed document or from your study of Congress. Respond to an opposing perspective.</p>`,
   sol:`<p>There's no single right answer. This is a model outline that would earn full credit (6/6).</p>
    <ol>
     <li><b>Thesis (with a line of reasoning):</b> "Members of Congress should act primarily as trustees because the framers designed representation to filter public passions, and trustees are better positioned to protect minority rights and long-term national interests."</li>
     <li><b>Evidence 1 — Federalist No. 10:</b> Madison argues that representatives "refine and enlarge the public views" through a body of citizens "whose wisdom may best discern the true interest of their country." <b>Reasoning:</b> this describes a trustee; Madison wanted representatives to use judgment rather than mirror majority factions, which could oppress minorities.</li>
     <li><b>Evidence 2 — the Senate's six-year staggered terms</b> (Article I): designed to insulate senators from short-term opinion. <b>Reasoning:</b> the Constitution itself builds in trustee-style independence, as in the "cooling saucer" idea. Example: senators who voted for unpopular but necessary measures, like the 2008 TARP bailout, arguably prevented a deeper financial collapse.</li>
     <li><b>Opposing view + rebuttal:</b> "Brutus No. 1 argued that representatives in a large republic would be too distant from the people and that true representation requires resembling constituents, which supports the delegate model. However, the House's two-year terms already provide a delegate-style check, so the system balances both; trustees in the Senate don't eliminate accountability, because they still face elections."</li>
    </ol>
    <p>Rubric reminders: the thesis must take a side (not "both have merits"); each piece of evidence needs its own "because" reasoning; the rebuttal must actually engage the opposing argument, not just mention it.</p>
    <div class="ans">Defensible thesis + Fed 10 (and/or Art. I terms) as evidence + reasoning for each + rebuttal of the Brutus No. 1 delegate argument.</div>`}
 ]
}
];

/* ============================================================

var content=document.getElementById('content');
var nav=document.getElementById('nav');
var peaks=document.getElementById('peaks');
var peakaxis=document.getElementById('peakaxis');
var chamber=document.getElementById('chamber');
var current=0;
var SEATS=[];

function buildNav(){
  var h='<div class="navgroup">The Docket</div>';
  TOPICS.forEach(function(t,i){
    if(t.id==='ref') h+='<div class="navgroup">Study tools</div>';
    h+='<button class="navitem" data-i="'+i+'">'+
       '<span class="num">'+(t.id==='ref'?'★':t.num)+'</span>'+
       '<span class="lbl">'+t.title+'</span>'+
       '<span class="dot" data-dot="'+t.id+'"></span></button>';
  });
  nav.innerHTML=h;
  nav.querySelectorAll('.navitem').forEach(function(b){
    b.addEventListener('click',function(){ show(+b.dataset.i); });
  });
}

function buildSpectrum(){
  var ph='',ax='';
  TOPICS.forEach(function(t){
    if(t.id==='ref')return;
    ph+='<div class="peak"><i data-bar="'+t.id+'" style="height:0%"></i></div>';
    ax+='<span>'+t.num.split('.')[1]+'</span>';
  });
  peaks.innerHTML=ph;peakaxis.innerHTML=ax;
  /* 100-seat hemicycle; seats fill left to right as problems are solved */
  var rows=5,r0=52,r1=102,cx=110,cy=110,radii=[],sum=0;
  for(var i=0;i<rows;i++){var r=r0+(r1-r0)*i/(rows-1);radii.push(r);sum+=r;}
  var counts=radii.map(function(r){return Math.round(100*r/sum);});
  counts[rows-1]+=100-counts.reduce(function(a,b){return a+b;},0);
  var pts=[];
  radii.forEach(function(r,i){var n=counts[i];for(var k=0;k<n;k++){var a=Math.PI-Math.PI*k/(n-1);pts.push({a:a,x:cx+r*Math.cos(a),y:cy-r*Math.sin(a)});}});
  pts.sort(function(p,q){return q.a-p.a;});
  var s='<title>Progress shown as seats in a 100-seat chamber</title>';
  pts.forEach(function(p,j){s+='<circle data-seat="'+j+'" cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="4" fill="#d9ccae"/>';});
  s+='<text x="110" y="106" text-anchor="middle" font-family="Fraunces, serif" font-weight="900" font-size="22" fill="#14213d" id="seatnum">0</text>';
  chamber.innerHTML=s;
  SEATS=chamber.querySelectorAll('circle');
}

function buildSections(){
  var h='';
  TOPICS.forEach(function(t,i){
    h+='<section id="'+t.id+'">';
    h+='<div class="tnum">'+(t.id==='ref'?'Reference · Night-before review':'Section '+t.num)+'</div>';
    h+='<h2 class="title">'+t.title+'</h2>';
    h+='<p class="lede">'+t.lede+'</p>';
    h+=t.body;
    h+='<div class="pracheader"><h3>Practice</h3><span class="count" data-count="'+t.id+'"></span></div>';
    t.problems.forEach(function(p,j){
      var key=t.id+'-'+j;
      h+='<div class="prob" id="p-'+key+'">'+
         '<div class="probq"><div class="qtag"><span class="kind">'+p.kind+'</span><span>No. '+(j+1)+'</span></div>'+
         '<div class="body">'+p.q+'</div></div>'+
         '<div class="probactions">'+
           '<button class="reveal" data-sol="'+key+'">Show solution</button>'+
           '<button class="mark" data-mark="'+key+'">Got it</button>'+
         '</div>'+
         '<div class="sol" id="s-'+key+'"><div class="sh">Worked solution</div>'+p.sol+'</div>'+
         '</div>';
    });
    h+='<div class="mastered"><div class="t"><b>Section status</b>'+
       'Mark this once you can explain it without looking.</div>'+
       '<button data-master="'+t.id+'">Mark as mastered</button></div>';
    h+='<div class="jump">';
    if(i>0)h+='<button data-go="'+(i-1)+'"><div class="d">← Previous</div><div class="n">'+TOPICS[i-1].title+'</div></button>';
    if(i<TOPICS.length-1)h+='<button data-go="'+(i+1)+'"><div class="d">Next →</div><div class="n">'+TOPICS[i+1].title+'</div></button>';
    h+='</div></section>';
  });
  content.innerHTML=h;

  content.querySelectorAll('[data-sol]').forEach(function(b){
    b.addEventListener('click',function(){
      var el=document.getElementById('s-'+b.dataset.sol);
      var open=el.classList.toggle('show');
      b.textContent=open?'Hide solution':'Show solution';
    });
  });
  content.querySelectorAll('[data-mark]').forEach(function(b){
    b.addEventListener('click',function(){
      var k=b.dataset.mark;
      state.solved[k]=!state.solved[k];
      paint();saveState();
    });
  });
  content.querySelectorAll('[data-master]').forEach(function(b){
    b.addEventListener('click',function(){
      var k=b.dataset.master;
      state.mastered[k]=!state.mastered[k];
      paint();saveState();
    });
  });
  content.querySelectorAll('[data-go]').forEach(function(b){
    b.addEventListener('click',function(){ show(+b.dataset.go); });
  });
}

function paint(){
  var totalP=0,doneP=0;
  TOPICS.forEach(function(t){
    var done=0;
    t.problems.forEach(function(p,j){
      var k=t.id+'-'+j,on=!!state.solved[k];
      if(on)done++;
      var btn=content.querySelector('[data-mark="'+k+'"]');
      if(btn){btn.classList.toggle('on',on);btn.textContent=on?'✓ Got it':'Got it';}
      var box=document.getElementById('p-'+k);
      if(box)box.classList.toggle('solved',on);
    });
    totalP+=t.problems.length;doneP+=done;
    var c=content.querySelector('[data-count="'+t.id+'"]');
    if(c)c.textContent=done+' / '+t.problems.length+' solved';
    var m=!!state.mastered[t.id];
    var mb=content.querySelector('[data-master="'+t.id+'"]');
    if(mb){mb.classList.toggle('on',m);mb.textContent=m?'✓ Mastered':'Mark as mastered';}
    var dot=nav.querySelector('[data-dot="'+t.id+'"]');
    if(dot)dot.classList.toggle('done',m);
    var bar=peaks.querySelector('[data-bar="'+t.id+'"]');
    if(bar){
      var frac=t.problems.length?done/t.problems.length:0;
      var h=Math.round((m?100:frac*80));
      bar.style.height=Math.max(h,4)+'%';
    }
  });
  var pct=Math.round(totalP?doneP/totalP*100:0);
  document.getElementById('pct').textContent=pct+'%';
  var seatsFilled=Math.round(totalP?doneP/totalP*100:0);
  for(var i=0;i<SEATS.length;i++){
    var on=i<seatsFilled;
    SEATS[i].setAttribute('fill',on?(i<60?'#14213d':(i<67?'#a88532':'#2f6b3f')):'#d9ccae');
  }
  var sn=document.getElementById('seatnum'); if(sn)sn.textContent=seatsFilled;
  var sub=document.getElementById('seatsub');
  if(sub)sub.textContent=seatsFilled+' of 100 seats · '+(seatsFilled>=67?'veto-proof supermajority':seatsFilled>=60?'cloture invoked — 67 overrides a veto':seatsFilled>=51?'majority — 60 invokes cloture':'51 for a majority');
}

function show(i){
  current=i;
  content.querySelectorAll('section').forEach(function(s,j){s.classList.toggle('on',j===i);});
  nav.querySelectorAll('.navitem').forEach(function(b,j){b.classList.toggle('on',j===i);});
  var t=TOPICS[i];
  document.getElementById('crumb').textContent=(t.id==='ref'?'Reference · ':t.num+' · ')+t.title;
  window.scrollTo({top:0,behavior:'instant'});
  syncRevealAll();
}

var allOpen=false;
function syncRevealAll(){
  allOpen=false;
  document.getElementById('revealall').classList.remove('on');
  document.getElementById('revealall').textContent='Show all solutions';
}
document.getElementById('revealall').addEventListener('click',function(){
  allOpen=!allOpen;
  var sec=content.querySelectorAll('section')[current];
  sec.querySelectorAll('.sol').forEach(function(s){s.classList.toggle('show',allOpen);});
  sec.querySelectorAll('[data-sol]').forEach(function(b){b.textContent=allOpen?'Hide solution':'Show solution';});
  this.classList.toggle('on',allOpen);
  this.textContent=allOpen?'Hide all solutions':'Show all solutions';
});

document.getElementById('reset').addEventListener('click',function(){
  state.solved={};state.mastered={};
  content.querySelectorAll('.sol').forEach(function(s){s.classList.remove('show');});
  content.querySelectorAll('[data-sol]').forEach(function(b){b.textContent='Show solution';});
  paint();saveState();
});

document.addEventListener('keydown',function(e){
  if(e.target.tagName==='INPUT')return;
  if(e.key==='ArrowRight'&&current<TOPICS.length-1)show(current+1);
  if(e.key==='ArrowLeft'&&current>0)show(current-1);
});

(async function init(){
  buildNav();buildSpectrum();buildSections();
  await loadState();
  paint();show(0);
})();
</script>
</body>
