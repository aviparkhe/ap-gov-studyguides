<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AP Gov — Ch. 4: Congress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Theme: "Congressional Record" — parchment, federal navy, brick & brass */
:root{
  --ink:#14213d;
  --ink-2:#1d2d52;
  --line:#cdbf9f;
  --paper:#f5efe2;
  --paper-2:#fffcf5;
  --paper-3:#ece3cf;
  --paper-line:#e0d4bb;
  --text:#1d2433;
  --text-soft:#61656f;
  --trace:#1f3a68;
  --brick:#a33327;
  --brick-dim:#f6e1dc;
  --brass:#a88532;
  --brass-dim:#f3e8cc;
  --cyan:#276767;
  --cyan-dim:#deecea;
  --amber:#a8561a;
  --amber-dim:#f8e7d2;
  --good:#2f6b3f;
  --good-dim:#e0eedf;
  --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans:'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --serif:'Fraunces', Georgia, 'Times New Roman', serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans);
  background:var(--paper);
  background-image:radial-gradient(rgba(20,33,61,.035) 1px, transparent 1px);
  background-size:18px 18px;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  line-height:1.6;
}
a{color:var(--brick)}

/* ---------- LAYOUT ---------- */
.shell{display:flex;min-height:100vh}
.rail{
  width:290px;flex:0 0 290px;
  background:var(--paper-3);color:var(--ink);
  position:sticky;top:0;height:100vh;overflow-y:auto;
  border-right:4px double var(--line);
}
.main{flex:1;min-width:0;padding:0 0 96px}
.wrap{max-width:880px;margin:0 auto;padding:0 32px}

/* ---------- RAIL ---------- */
.brand{padding:24px 22px 18px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center}
.seal{
  flex:0 0 58px;height:58px;border-radius:50%;
  border:2px solid var(--ink);box-shadow:inset 0 0 0 4px var(--paper-3),inset 0 0 0 5px var(--brass);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-weight:900;font-size:22px;color:var(--ink);background:var(--paper-2)
}
.brand .eyebrow{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--brick);margin:0 0 4px
}
.brand h1{font-family:var(--serif);font-size:23px;line-height:1.05;margin:0;color:var(--ink);font-weight:900;letter-spacing:-.01em}
.brand p{margin:5px 0 0;font-size:11.5px;color:var(--text-soft);line-height:1.35}

.whip{padding:14px 22px 14px;border-bottom:1px solid var(--line)}
.whip .lbl{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--text-soft);display:flex;justify-content:space-between;margin-bottom:4px
}
.whip .lbl b{color:var(--brick);font-weight:700}
.chamber{width:100%;height:auto;display:block}
.chamber circle{transition:fill .35s ease}
.whip .sub{font-family:var(--mono);font-size:9.5px;color:var(--text-soft);text-align:center;margin-top:2px}
.peaks{display:flex;align-items:flex-end;gap:4px;height:30px;margin-top:12px}
.peak{flex:1;background:#ddd1b6;position:relative;height:100%}
.peak i{position:absolute;bottom:0;left:0;right:0;background:var(--ink);transition:height .45s cubic-bezier(.2,.8,.2,1);display:block}
.peakaxis{display:flex;gap:4px;margin-top:4px;font-family:var(--mono);font-size:8.5px;color:var(--text-soft)}
.peakaxis span{flex:1;text-align:center}

nav{padding:8px 0 30px}
.navgroup{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--brass);padding:14px 22px 6px;font-weight:700
}
.navitem{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:none;border:0;color:var(--ink);font-family:var(--sans);font-size:13.5px;
  padding:8px 22px;cursor:pointer;border-left:4px solid transparent;line-height:1.3
}
.navitem:hover{background:rgba(20,33,61,.06)}
.navitem.on{background:var(--ink);color:var(--paper);border-left-color:var(--brick)}
.navitem .num{font-family:var(--mono);font-size:11px;color:var(--brick);flex:0 0 28px;font-weight:700}
.navitem.on .num{color:#f0c9a0}
.navitem .dot{margin-left:auto;width:9px;height:9px;border:1.5px solid var(--line);transform:rotate(45deg);flex:0 0 9px}
.navitem .dot.done{background:var(--good);border-color:var(--good)}
.reset{
  display:block;margin:8px 22px 0;background:none;border:1px solid var(--line);color:var(--text-soft);
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  padding:7px 10px;cursor:pointer;width:calc(100% - 44px)
}
.reset:hover{color:var(--brick);border-color:var(--brick)}

/* ---------- TOPBAR ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--ink);border-bottom:3px solid var(--brass)}
.topbar .wrap{display:flex;align-items:center;gap:14px;padding-top:12px;padding-bottom:12px}
.crumb{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#e9dfc8}
.topbar .spacer{flex:1}
.tbtn{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  background:transparent;border:1px solid #4a5a80;color:#e9dfc8;padding:7px 11px;cursor:pointer;white-space:nowrap
}
.tbtn:hover{border-color:var(--brass);color:#fff}
.tbtn.on{background:var(--brass);border-color:var(--brass);color:var(--ink)}

/* ---------- SECTIONS ---------- */
section{display:none;padding-top:38px}
section.on{display:block;animation:rise .3s ease}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.tnum{font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--brick);text-transform:uppercase;margin-bottom:8px;font-weight:700}
h2.title{
  font-family:var(--serif);font-size:clamp(30px,4.6vw,48px);line-height:1.02;margin:0 0 14px;font-weight:900;
  letter-spacing:-.02em;color:var(--ink);padding-bottom:14px;
  border-bottom:1px solid var(--ink);box-shadow:0 3px 0 -1px var(--paper),0 4px 0 -1px var(--ink)
}
.lede{font-family:var(--serif);font-style:italic;font-weight:500;font-size:18px;color:#454a58;margin:18px 0 26px;max-width:62ch;line-height:1.5}

h3{
  font-family:var(--sans);font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);
  margin:36px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--paper-line)
}
h3::before{content:"§ ";color:var(--brick)}
h4{font-family:var(--serif);font-size:17px;font-weight:700;margin:22px 0 6px;color:var(--ink)}
p{margin:0 0 12px}
ul,ol{margin:0 0 14px;padding-left:22px}
li{margin:0 0 7px}
li::marker{color:var(--brick)}
b,strong{font-weight:700;color:#10182c}
em{font-style:italic}
code,.mono{font-family:var(--mono);font-size:.9em}
.chem{font-family:var(--mono);font-size:.9em;white-space:nowrap;background:var(--brass-dim);padding:0 4px;border-radius:2px}

.eq{background:var(--paper-2);border:1px solid var(--paper-line);border-left:5px solid var(--ink);padding:14px 16px;margin:14px 0}
.eq .f{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--ink)}
.eq .n{font-size:13px;color:var(--text-soft);margin-top:4px}

.trap{background:var(--amber-dim);border:1px solid #e8c9a4;border-top:4px solid var(--amber);padding:13px 16px;margin:18px 0;font-size:14.5px}
.trap .h{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);margin-bottom:6px;font-weight:700}
.trap .h::before{content:"⚠ "}
.trap p:last-child{margin-bottom:0}

.frq{background:var(--cyan-dim);border:1px solid #b9d6d2;border-top:4px solid var(--cyan);padding:13px 16px;margin:18px 0;font-size:14.5px}
.frq .h{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);margin-bottom:6px;font-weight:700}
.frq .h::before{content:"✎ "}
.frq p:last-child{margin-bottom:0}

table{width:100%;border-collapse:collapse;margin:16px 0;font-size:13.5px;background:var(--paper-2)}
th,td{border:1px solid var(--paper-line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--ink);color:#f3ead6;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
tbody tr:nth-child(even){background:#f8f2e4}
td:first-child{font-weight:600;color:var(--ink)}

/* ---------- PRACTICE ---------- */
.pracheader{display:flex;align-items:baseline;gap:12px;margin:48px 0 4px;border-top:6px double var(--ink);padding-top:14px}
.pracheader h3{border:0;margin:0;padding:0;font-family:var(--serif);font-size:24px;letter-spacing:-.01em;text-transform:none;font-weight:900}
.pracheader h3::before{content:""}
.pracheader .count{font-family:var(--mono);font-size:11px;color:var(--text-soft);margin-left:auto}

.prob{background:var(--paper-2);border:1px solid var(--paper-line);border-left:6px solid var(--brick);margin:16px 0;overflow:hidden;box-shadow:0 1px 0 rgba(20,33,61,.05)}
.prob.solved{border-left-color:var(--good)}
.probq{padding:16px 20px}
.qtag{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-soft);margin-bottom:8px;display:flex;align-items:center;gap:10px}
.qtag .kind{color:var(--brick);font-weight:700}
.probq .body{font-size:15px}
.probq .body p:last-child{margin-bottom:0}
.probactions{display:flex;gap:8px;align-items:center;padding:0 20px 16px;flex-wrap:wrap}
.reveal{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;background:var(--ink);color:#f3ead6;border:0;padding:9px 14px;cursor:pointer}
.reveal:hover{background:var(--brick)}
.mark{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;background:none;border:1px solid var(--line);color:var(--text-soft);padding:9px 12px;cursor:pointer}
.mark:hover{border-color:var(--good);color:var(--good)}
.mark.on{background:var(--good-dim);border-color:#a9cfae;color:var(--good)}
.sol{display:none;border-top:1px dashed var(--line);background:#fbf7ec;padding:16px 20px;font-size:14.5px}
.sol.show{display:block;animation:rise .22s ease}
.sol .sh{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--brick);margin-bottom:9px;font-weight:700}
.sol ol{padding-left:20px}
.sol .ans{margin-top:12px;background:var(--good-dim);border:1px solid #a9cfae;border-left:5px solid var(--good);padding:9px 12px;font-weight:600;color:#1f4f2c;font-size:14px}
.work{font-family:var(--mono);font-size:12.5px;background:#efe7d4;padding:10px 12px;margin:8px 0;overflow-x:auto;white-space:pre-wrap;border-left:3px solid var(--brass)}

.fig{width:100%;height:auto;display:block;background:var(--paper-2);border:1px solid var(--paper-line);margin:16px 0 6px}
.figcap{font-family:var(--mono);font-size:10.5px;color:var(--text-soft);margin:0 0 18px;text-align:center;letter-spacing:.03em}

.mastered{display:flex;align-items:center;gap:12px;margin:40px 0 10px;padding:16px 20px;background:var(--ink);color:#f3ead6;flex-wrap:wrap;border-bottom:4px solid var(--brass)}
.mastered .t{font-size:14px}
.mastered .t b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#f0c9a0;margin-bottom:3px}
.mastered button{margin-left:auto;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;background:none;border:1px solid #4a5a80;color:#f3ead6;padding:9px 14px;cursor:pointer}
.mastered button:hover{border-color:#8fcf9c;color:#8fcf9c}
.mastered button.on{background:#8fcf9c;border-color:#8fcf9c;color:var(--ink);font-weight:700}

.jump{display:flex;gap:10px;margin-top:44px;padding-top:20px;border-top:1px solid var(--line)}
.jump button{flex:1;background:var(--paper-2);border:1px solid var(--paper-line);padding:14px 16px;text-align:left;cursor:pointer;font-family:var(--sans)}
.jump button:hover{border-color:var(--brick)}
.jump .d{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--brick)}
.jump .n{font-family:var(--serif);font-size:16px;font-weight:700;margin-top:3px;color:var(--ink)}
.jump button:last-child{text-align:right}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin:18px 0}
.card{background:var(--paper-2);border:1px solid var(--paper-line);border-top:3px solid var(--ink);padding:14px 16px}
.card .k{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--brick);margin-bottom:6px;font-weight:700}
.card .v{font-size:14px}
.card .v p:last-child{margin-bottom:0}

:focus-visible{outline:2px solid var(--brick);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:860px){
  .shell{display:block}
  .rail{position:static;width:auto;height:auto;border-right:0;border-bottom:4px double var(--line)}
  .whip{display:none}
  nav{padding:6px 0 12px;display:flex;overflow-x:auto;gap:2px;-webkit-overflow-scrolling:touch}
  .navgroup{display:none}
  .navitem{width:auto;white-space:nowrap;border-left:0;border-bottom:3px solid transparent;padding:10px 14px}
  .navitem.on{border-left:0;border-bottom-color:var(--brick)}
  .navitem .dot{margin-left:6px}
  .reset{display:none}
  .wrap{padding:0 16px}
  .jump{flex-direction:column}
  table{display:block;overflow-x:auto}
}
@media print{
  body{background:#fff}
  .rail,.topbar,.probactions,.jump,.mastered{display:none}
  section{display:block!important;page-break-before:always}
  .sol{display:block!important}
}
</style>
</head>
<body>
<div class="shell">

  <aside class="rail">
    <div class="brand">
      <div class="seal">IV</div>
      <div>
        <p class="eyebrow">AP Gov · Ch. 4</p>
        <h1>The Legislative Branch</h1>
        <p>CED topics 2.1–2.3 + redistricting · Unit 2 is 25–36% of the exam</p>
      </div>
    </div>

    <div class="whip">
      <div class="lbl"><span>Whip count · problems solved</span><b id="pct">0%</b></div>
      <svg class="chamber" id="chamber" viewBox="0 0 220 116" role="img"><title>Progress shown as seats in a 100-seat chamber</title></svg>
      <div class="sub" id="seatsub">0 of 100 seats · 60 invokes cloture</div>
      <div class="peaks" id="peaks"></div>
      <div class="peakaxis" id="peakaxis"></div>
    </div>

    <nav id="nav"></nav>
    <button class="reset" id="reset">Clear all progress</button>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="wrap">
        <span class="crumb" id="crumb">4.1</span>
        <span class="spacer"></span>
        <button class="tbtn" id="revealall">Show all solutions</button>
      </div>
    </div>
    <div class="wrap" id="content"></div>
  </main>

</div>

<script>
/* ============================================================
   STORAGE — remembers what he has solved, with safe fallbacks
   ============================================================ */
var KEY='apgov-ch4-congress-progress';
var state={solved:{},mastered:{}};

async function loadState(){
  var raw=null;
  try{ if(window.storage){ var r=await window.storage.get(KEY); if(r&&r.value) raw=r.value; } }catch(e){}
  if(!raw){ try{ raw=localStorage.getItem(KEY); }catch(e){} }
  if(raw){ try{ var p=JSON.parse(raw); state.solved=p.solved||{}; state.mastered=p.mastered||{}; }catch(e){} }
}
async function saveState(){
  var s=JSON.stringify(state);
  try{ if(window.storage) await window.storage.set(KEY,s); }catch(e){}
  try{ localStorage.setItem(KEY,s); }catch(e){}
}

/* ============================================================
   CHART BUILDERS — drawn to scale from the data passed in
   ============================================================ */
var MONO='font-family="JetBrains Mono, monospace"';
var AX='#1d2433', GRID='#e7dcc4', LBL='#61656f';
var PARTY={R:'#b23a3a',D:'#2a5caa',I:'#8b8b8b',V:'#e4d9c1'};

/* Hemicycle: o.groups=[{n:53,c:'R',label:'Republicans'},...], o.rows (default 5) */
function hemicycle(o){
  var total=o.groups.reduce(function(a,g){return a+g.n;},0);
  var rows=o.rows||(total>150?9:5);
  var W=620,H=o.legendH===0?300:340,cx=310,cy=280,r0=110,r1=250;
  var radii=[],sumR=0;
  for(var i=0;i<rows;i++){var r=r0+(r1-r0)*i/(rows-1);radii.push(r);sumR+=r;}
  var counts=radii.map(function(r){return Math.round(total*r/sumR);});
  var diff=total-counts.reduce(function(a,b){return a+b;},0); counts[rows-1]+=diff;
  var seats=[];
  radii.forEach(function(r,i){
    var n=counts[i];
    for(var k=0;k<n;k++){var a=Math.PI-(n===1?Math.PI/2:Math.PI*k/(n-1));seats.push({a:a,x:cx+r*Math.cos(a),y:cy-r*Math.sin(a)});}
  });
  seats.sort(function(p,q){return q.a-p.a;});
  var dot=Math.max(3.2,Math.min(9,(r1-r0)/rows*0.42));
  var s='<svg class="fig" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" role="img"><title>'+(o.alt||'Chamber composition')+'</title>';
  var idx=0;
  o.groups.forEach(function(g){
    for(var k=0;k<g.n;k++){var p=seats[idx++];s+='<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+dot.toFixed(1)+'" fill="'+(PARTY[g.c]||g.c)+'"/>';}
  });
  s+='<text x="'+cx+'" y="'+(cy-20)+'" text-anchor="middle" font-family="Fraunces, serif" font-weight="900" font-size="30" fill="'+AX+'">'+total+'</text>';
  s+='<text x="'+cx+'" y="'+(cy+2)+'" text-anchor="middle" '+MONO+' font-size="10" fill="'+LBL+'">'+(o.center||'seats')+'</text>';
  var lx=40;
  o.groups.forEach(function(g){
    s+='<rect x="'+lx+'" y="'+(H-26)+'" width="12" height="12" fill="'+(PARTY[g.c]||g.c)+'"/>';
    var t=(g.label||g.c)+' · '+g.n;
    s+='<text x="'+(lx+18)+'" y="'+(H-16)+'" '+MONO+' font-size="11" fill="'+AX+'">'+t+'</text>';
    lx+=24+t.length*7.2;
  });
  s+='</svg>';
  if(o.caption)s+='<p class="figcap">'+o.caption+'</p>';
  return s;
}

/* Bar chart: o.items=[{label,value}], o.min,o.max,o.step, o.ylabel, o.unit, o.showVal */
function barChart(o){
  var W=620,H=o.h||320,L=58,R=18,T=26,B=o.rotate?86:56;
  var pw=W-L-R,ph=H-T-B;
  var min=o.min||0,max=o.max,step=o.step||10;
  var Y=function(v){return T+ph-(v-min)/(max-min)*ph;};
  var s='<svg class="fig" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" role="img"><title>'+(o.alt||'Bar chart')+'</title>';
  for(var v=min;v<=max+1e-9;v+=step){
    s+='<line x1="'+L+'" y1="'+Y(v).toFixed(1)+'" x2="'+(L+pw)+'" y2="'+Y(v).toFixed(1)+'" stroke="'+(v===0?AX:GRID)+'" stroke-width="'+(v===0?1.5:1)+'"/>';
    s+='<text x="'+(L-8)+'" y="'+(Y(v)+3.5).toFixed(1)+'" text-anchor="end" '+MONO+' font-size="10" fill="'+LBL+'">'+(v>0&&o.signed?'+':'')+v+(o.unit||'')+'</text>';
  }
  s+='<line x1="'+L+'" y1="'+T+'" x2="'+L+'" y2="'+(T+ph)+'" stroke="'+AX+'" stroke-width="1.5"/>';
  if(min>=0)s+='<line x1="'+L+'" y1="'+(T+ph)+'" x2="'+(L+pw)+'" y2="'+(T+ph)+'" stroke="'+AX+'" stroke-width="1.5"/>';
  s+='<text x="14" y="'+(T+ph/2)+'" transform="rotate(-90 14 '+(T+ph/2)+')" text-anchor="middle" '+MONO+' font-size="10" fill="'+LBL+'">'+(o.ylabel||'')+'</text>';
  var n=o.items.length,slot=pw/n,bw=Math.min(46,slot*0.62);
  var z=Y(Math.max(0,min));
  o.items.forEach(function(it,i){
    var cx=L+slot*(i+0.5),y=Y(it.value),top=Math.min(y,z),h=Math.abs(z-y);
    var col=it.color||(it.value<0?'var(--brick)':'var(--trace)');
    s+='<rect x="'+(cx-bw/2).toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(h,1).toFixed(1)+'" fill="'+col+'"/>';
    if(o.showVal){
      var ty=it.value<0?y+14:y-6;
      s+='<text x="'+cx.toFixed(1)+'" y="'+ty.toFixed(1)+'" text-anchor="middle" '+MONO+' font-size="10.5" font-weight="700" fill="'+AX+'">'+(it.value>0&&o.signed?'+':'')+it.value+(o.unit||'')+'</text>';
    }
    var ly=T+ph+16;
    if(o.rotate){
      s+='<text x="'+cx.toFixed(1)+'" y="'+ly+'" transform="rotate(-35 '+cx.toFixed(1)+' '+ly+')" text-anchor="end" '+MONO+' font-size="10" fill="'+AX+'">'+it.label+'</text>';
    }else{
      s+='<text x="'+cx.toFixed(1)+'" y="'+ly+'" text-anchor="middle" '+MONO+' font-size="10" fill="'+AX+'">'+it.label+'</text>';
    }
  });
  if(o.xlabel)s+='<text x="'+(L+pw/2)+'" y="'+(H-8)+'" text-anchor="middle" '+MONO+' font-size="10.5" fill="'+LBL+'">'+o.xlabel+'</text>';
  s+='</svg>';
  if(o.caption)s+='<p class="figcap">'+o.caption+'</p>';
  return s;
}

/* Grouped line chart: o.x=[labels], o.series=[{name,values,color,dash}], o.min,o.max,o.step */
function lineChart(o){
  var W=620,H=320,L=58,R=18,T=26,B=70;
  var pw=W-L-R,ph=H-T-B,min=o.min,max=o.max,step=o.step;
  var n=o.x.length;
  var X=function(i){return L+pw*(i+0.5)/n;};
  var Y=function(v){return T+ph-(v-min)/(max-min)*ph;};
  var s='<svg class="fig" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" role="img"><title>'+(o.alt||'Line chart')+'</title>';
  for(var v=min;v<=max+1e-9;v+=step){
    s+='<line x1="'+L+'" y1="'+Y(v).toFixed(1)+'" x2="'+(L+pw)+'" y2="'+Y(v).toFixed(1)+'" stroke="'+GRID+'"/>';
    s+='<text x="'+(L-8)+'" y="'+(Y(v)+3.5).toFixed(1)+'" text-anchor="end" '+MONO+' font-size="10" fill="'+LBL+'">'+v+(o.unit||'')+'</text>';
  }
  s+='<line x1="'+L+'" y1="'+T+'" x2="'+L+'" y2="'+(T+ph)+'" stroke="'+AX+'" stroke-width="1.5"/>';
  s+='<line x1="'+L+'" y1="'+(T+ph)+'" x2="'+(L+pw)+'" y2="'+(T+ph)+'" stroke="'+AX+'" stroke-width="1.5"/>';
  s+='<text x="14" y="'+(T+ph/2)+'" transform="rotate(-90 14 '+(T+ph/2)+')" text-anchor="middle" '+MONO+' font-size="10" fill="'+LBL+'">'+(o.ylabel||'')+'</text>';
  o.x.forEach(function(l,i){s+='<text x="'+X(i).toFixed(1)+'" y="'+(T+ph+16)+'" text-anchor="middle" '+MONO+' font-size="10" fill="'+AX+'">'+l+'</text>';});
  var lx=L+10;
  o.series.forEach(function(se){
    var d=se.values.map(function(v,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);}).join(' ');
    s+='<path d="'+d+'" fill="none" stroke="'+se.color+'" stroke-width="2.4"'+(se.dash?' stroke-dasharray="6 4"':'')+'/>';
    se.values.forEach(function(v,i){s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="3.6" fill="'+se.color+'"/>';});
    s+='<line x1="'+lx+'" y1="'+(H-16)+'" x2="'+(lx+22)+'" y2="'+(H-16)+'" stroke="'+se.color+'" stroke-width="2.4"'+(se.dash?' stroke-dasharray="6 4"':'')+'/>';
    s+='<text x="'+(lx+28)+'" y="'+(H-12)+'" '+MONO+' font-size="11" fill="'+AX+'">'+se.name+'</text>';
    lx+=60+se.name.length*7;
  });
  s+='</svg>';
  if(o.caption)s+='<p class="figcap">'+o.caption+'</p>';
  return s;
}

/* Gerrymander grid: o.grid=['RRDDR',...] voters, o.districts=['11223',...] same shape */
function gerry(o){
  var rows=o.grid.length,cols=o.grid[0].length,c=o.cell||44;
  var W=cols*c+40,H=rows*c+40,ox=20,oy=20;
  var s='<svg class="fig" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" role="img" style="max-width:'+Math.min(W,420)+'px;margin-left:auto;margin-right:auto"><title>'+(o.alt||'District map')+'</title>';
  for(var r=0;r<rows;r++)for(var k=0;k<cols;k++){
    var v=o.grid[r][k],x=ox+k*c,y=oy+r*c;
    s+='<rect x="'+x+'" y="'+y+'" width="'+c+'" height="'+c+'" fill="'+(v==='R'?'#f3d6d2':'#d6e0f2')+'" stroke="#fffcf5" stroke-width="1"/>';
    s+='<text x="'+(x+c/2)+'" y="'+(y+c/2+5)+'" text-anchor="middle" '+MONO+' font-size="14" font-weight="700" fill="'+(v==='R'?PARTY.R:PARTY.D)+'">'+v+'</text>';
  }
  if(o.districts){
    var D=o.districts;
    for(var r2=0;r2<rows;r2++)for(var k2=0;k2<cols;k2++){
      var x2=ox+k2*c,y2=oy+r2*c,d=D[r2][k2];
      if(k2===cols-1||D[r2][k2+1]!==d) s+='<line x1="'+(x2+c)+'" y1="'+y2+'" x2="'+(x2+c)+'" y2="'+(y2+c)+'" stroke="'+AX+'" stroke-width="4" stroke-linecap="round"/>';
      if(k2===0) s+='<line x1="'+x2+'" y1="'+y2+'" x2="'+x2+'" y2="'+(y2+c)+'" stroke="'+AX+'" stroke-width="4" stroke-linecap="round"/>';
      if(r2===rows-1||D[r2+1][k2]!==d) s+='<line x1="'+x2+'" y1="'+(y2+c)+'" x2="'+(x2+c)+'" y2="'+(y2+c)+'" stroke="'+AX+'" stroke-width="4" stroke-linecap="round"/>';
      if(r2===0) s+='<line x1="'+x2+'" y1="'+y2+'" x2="'+(x2+c)+'" y2="'+y2+'" stroke="'+AX+'" stroke-width="4" stroke-linecap="round"/>';
    }
  }
  s+='</svg>';
  if(o.caption)s+='<p class="figcap">'+o.caption+'</p>';
  return s;
}

{
 id:'t41', num:'4.1', title:'House vs. Senate',
 lede:'The framers built two chambers on purpose: one close to the public mood, one insulated from it. Almost every difference between the House and Senate traces back to that single design choice.',
 body:`
 <h3>Why two chambers at all</h3>
 <p>Article I creates a <b>bicameral</b> legislature. At the Constitutional Convention (1787), the large states backed the <b>Virginia Plan</b> (representation by population) and the small states backed the <b>New Jersey Plan</b> (equal representation per state). The <b>Great Compromise</b> (also called the <b>Connecticut Compromise</b>, brokered by <b>Roger Sherman</b>) gave each side one chamber: the House by population, the Senate with two per state.</p>
 <p>Bicameralism is also a <b>check on majority power</b>. In <b>Federalist No. 51</b>, Madison argues that "in republican government, the legislative authority necessarily predominates," so the remedy is to "divide the legislature into different branches" with different modes of election. Two chambers with different constituencies and terms make it harder for one passing majority to take over — and that's also why passing laws is slow.</p>
 <p>The story (probably apocryphal) is that Washington told Jefferson the Senate was the saucer you pour hot tea into to cool it. The "<b>cooling saucer</b>" is a good line to drop when explaining why the Senate has longer terms and looser debate rules.</p>

 <h3>The comparison you have to know cold</h3>
 <table>
  <thead><tr><th></th><th>House of Representatives</th><th>Senate</th></tr></thead>
  <tbody>
   <tr><td>Size</td><td>435 voting members (fixed by the Reapportionment Act of 1929) + 6 non-voting delegates (D.C., Puerto Rico, Guam, etc.)</td><td>100 (2 per state)</td></tr>
   <tr><td>Term</td><td>2 years; entire House up every election</td><td>6 years; staggered, ~⅓ up every 2 years</td></tr>
   <tr><td>Minimum age</td><td>25</td><td>30</td></tr>
   <tr><td>Citizenship</td><td>7 years</td><td>9 years</td></tr>
   <tr><td>Residency</td><td>Inhabitant of the state (not required to live in the district)</td><td>Inhabitant of the state</td></tr>
   <tr><td>Constituency</td><td>A district (~761,000 people after the 2020 census)</td><td>The whole state</td></tr>
   <tr><td>Originally chosen by</td><td>The people</td><td>State legislatures, until the <b>17th Amendment (1913)</b> made it a popular vote</td></tr>
   <tr><td>Debate</td><td>Strict limits, set by the Rules Committee</td><td>Unlimited unless 60 vote for cloture — the filibuster lives here</td></tr>
   <tr><td>Presiding officer</td><td>Speaker of the House</td><td>Vice President (formally); President pro tempore in practice</td></tr>
   <tr><td>Character</td><td>More responsive to short-term opinion, more partisan, more rule-bound, more hierarchical</td><td>More deliberative, more individualistic, more insulated</td></tr>
  </tbody>
 </table>

 <h3>Exclusive powers — the free MCQ points</h3>
 <div class="cards">
  <div class="card"><div class="k">House only</div><div class="v"><ul style="margin:0">
   <li><b>Revenue bills</b> must start here (Origination Clause, Art. I §7). By tradition, appropriations bills do too.</li>
   <li><b>Impeach</b> (formally accuse) federal officials — simple majority.</li>
   <li>Choose the <b>President</b> if no one wins an Electoral College majority (12th Amendment; each state delegation gets <b>one</b> vote). Happened in 1800 and 1824.</li>
  </ul></div></div>
  <div class="card"><div class="k">Senate only</div><div class="v"><ul style="margin:0">
   <li><b>Try</b> impeachments; <b>2/3 (67)</b> to convict and remove. Chief Justice presides if the President is on trial.</li>
   <li><b>Advice and consent</b>: confirm judges, cabinet secretaries, ambassadors — simple majority.</li>
   <li><b>Ratify treaties</b> — 2/3 of senators present.</li>
   <li>Choose the <b>Vice President</b> if no Electoral College majority.</li>
  </ul></div></div>
 </div>

 <h3>Why term length changes behavior</h3>
 <p>A House member elected in November starts running again almost immediately. That makes the House the chamber most sensitive to public opinion and to its specific district — the framers called it "the people's house." A senator only faces voters every six years and represents a whole (usually more diverse) state, so senators can take positions that are unpopular in the short term. The staggered Senate terms also mean that one wave election can flip the whole House but at most about a third of the Senate.</p>
 <p>The Senate's equal representation cuts the other way: Wyoming (≈590,000 people) and California (≈39 million) each get two senators, so a senator from a small state represents far fewer people. This is the most-cited "undemocratic" feature of Congress, and it's a direct product of the Great Compromise.</p>

 <h3>Where things stand now (119th Congress, 2025–2027)</h3>
 <ul>
  <li><b>Senate:</b> 53 Republicans, 45 Democrats, 2 independents (Bernie Sanders, Angus King) who caucus with the Democrats.</li>
  <li><b>House:</b> a narrow Republican majority; it opened at 220–215 and has hovered within a few seats of that as members resign and special elections fill seats.</li>
  <li>Unified government: Republican House, Senate, and presidency. The 2026 midterms on November 3, 2026 put the whole House and 35 Senate seats on the ballot.</li>
 </ul>

 <div class="trap">
  <div class="h">Where points get lost</div>
  <p><b>Impeach ≠ remove.</b> The House impeaches (accuses); the Senate convicts and removes. Andrew Johnson (1868), Bill Clinton (1998), and Donald Trump (2019 and 2021) were all impeached — none was removed. Nixon resigned in 1974 before the House voted.</p>
  <p><b>"Revenue" means taxes, not all bills.</b> Any other bill can start in either chamber. MCQs love "all bills must originate in the House" as a wrong answer.</p>
  <p><b>Treaties ≠ appointments.</b> Treaties need 2/3 of the Senate; appointments need a simple majority. The House has no formal role in either.</p>
 </div>

 <div class="frq">
  <div class="h">FRQ language that scores</div>
  <p>"Because House members serve <b>two-year terms</b> and represent smaller districts, they are more likely to respond to <b>short-term shifts in constituent opinion</b>, whereas senators, with <b>six-year staggered terms</b>, are more insulated and can take a longer view."</p>
 </div>
 `,

   sol:`<ol>

  {kind:'Read the chamber',

    <li>Count the majority: 53 Republicans. The minority caucus: 45 + 2 = 47.</li>
    <li>(a) Confirmation needs a simple majority (51, or 50 + VP). 53 ≥ 51 → <b>yes</b>.</li>
    <li>(b) Cloture needs 60. 53 < 60 → <b>no</b>; they'd need 7 minority votes.</li>
    <li>(c) Treaty ratification needs 2/3 of those present — 67 if all 100 vote. <b>No</b>.</li>
    <li>(d) Conviction needs 2/3 — 67. <b>No</b>.</li></ol>
    <div class="work">simple majority  51   ✓ 53
cloture          60   ✗ (needs 7 more)
treaty / convict 67   ✗ (needs 14 more)</div>
    <p>This is exactly why the filibuster matters: a 53-seat majority controls confirmations but not ordinary legislation.</p>
    <div class="ans">Only (a). Cloture needs 60; treaties and convictions need 67.</div>`},

  {kind:'Concept application',
   q:`<p>In 2024, a House member from a swing district voted against her party's leadership on a spending bill, citing a flood of calls from constituents. A senator from the same state, not up for reelection until 2030, voted with party leadership.</p><p>(A) Describe one constitutional difference between the House and Senate that helps explain the different votes. (B) Explain how that difference affects how responsive each member is to constituents.</p>`,
   sol:`<ol>
    <li><b>(A) Describe:</b> House members serve two-year terms and represent a single district; senators serve six-year staggered terms and represent the whole state.</li>
    <li><b>(B) Explain:</b> Because the House member faces voters again in under two years, a spike in constituent calls is a direct electoral threat, so she acts as a <b>delegate</b>. The senator won't face voters for six years, so the same pressure is distant and diluted across a whole state, freeing her to follow party leadership or act as a <b>trustee</b>.</li></ol>
    <p>Scoring note: "Describe" needs a specific feature, not "the House is different." "Explain" needs the <b>because → so</b> chain linking that feature to the behavior in the scenario.</p>

  {kind:'Impeachment math',
   q:'The House votes 230–197 to impeach a federal judge. The Senate then votes 61–39 to convict. What happens to the judge?',
   sol:`<ol>

    <p>Real parallel: at Trump's second impeachment trial (Feb. 2021) the Senate voted <b>57–43</b> to convict — a bipartisan majority, but 10 short of 67, so it counted as an acquittal. Fifteen federal judges have been impeached in U.S. history; eight were convicted and removed.</p>
    <div class="ans">Impeached but acquitted — a Senate majority isn't enough; conviction requires 67.</div>`},

  {kind:'Origin of the design',

   sol:`<ol>
    <li>Large states wanted population-based representation (Virginia Plan); small states wanted equal representation (New Jersey Plan).</li>
    <li>The Great (Connecticut) Compromise created a House apportioned by population and a Senate with two members per state.</li>
    <li>Consequence: small-state overrepresentation in the Senate. A majority of senators can represent well under half of the U.S. population, which matters for confirmations and for the filibuster.</li></ol>

{
 id:'t42', num:'4.2', title:'Powers of Congress',
 lede:'Article I gives Congress a list of powers, then one clause that stretches the list. Most fights over federal power are really fights over how far that stretch goes.',
 body:`
 <h3>Enumerated (expressed) powers — Article I, Section 8</h3>
 <p>These are written out explicitly. The ones the AP exam cares about most:</p>
 <div class="cards">
  <div class="card"><div class="k">Money</div><div class="v">Lay and collect <b>taxes</b>; <b>borrow</b> money; <b>coin</b> money; spend for the "general welfare." Art. I §9 adds: no money leaves the Treasury without an appropriation made by law. Together this is the <b>power of the purse</b>.</div></div>
  <div class="card"><div class="k">Commerce</div><div class="v">Regulate commerce with foreign nations, <b>among the several states</b>, and with Native American tribes. The <b>Commerce Clause</b> is the basis for most modern federal regulation.</div></div>
  <div class="card"><div class="k">War & military</div><div class="v"><b>Declare war</b>; raise and support armies; provide and maintain a navy; make rules for the armed forces; call up the militia.</div></div>
  <div class="card"><div class="k">Other</div><div class="v">Establish post offices; set naturalization rules; grant patents and copyrights; create federal courts below the Supreme Court.</div></div>
 </div>

 <h3>Implied powers and the Necessary and Proper Clause</h3>
 <p>The final clause of §8 lets Congress make all laws "<b>necessary and proper</b>" for carrying out its listed powers. It's nicknamed the <b>elastic clause</b> because it stretches Congress's reach to powers the Constitution never names.</p>
 <p><b>McCulloch v. Maryland (1819)</b> is the landmark case. Chief Justice John Marshall ruled that Congress could create a national bank. It isn't listed, but it is a reasonable means of carrying out the listed powers to tax, borrow, and regulate commerce. Maryland also couldn't tax the bank, because "the power to tax involves the power to destroy" and federal law is supreme (<b>Supremacy Clause</b>).</p>
 <p>The Anti-Federalist <b>Brutus No. 1</b> saw this coming. It warned that the Necessary and Proper and Supremacy Clauses would let the national government swallow the states. That's a strong piece of evidence if an argument essay asks about congressional power.</p>
 <p>The Commerce Clause has limits. In <b>United States v. Lopez (1995)</b>, the Court struck down the Gun-Free School Zones Act because carrying a gun near a school is not economic activity that substantially affects interstate commerce. This was the first time since the New Deal that the Court had limited the Commerce Clause.</p>

 <h3>Non-legislative powers</h3>
 <table>
  <thead><tr><th>Power</th><th>What it is</th><th>Namedrop</th></tr></thead>
  <tbody>
   <tr><td>Oversight</td><td>Hearings, investigations, subpoenas, and budget control over the executive branch</td><td>Senate Watergate hearings (1973); House Jan. 6 Committee (2021–22)</td></tr>
   <tr><td>Impeachment</td><td>House accuses, Senate tries (Art. I §2–3)</td><td>Johnson 1868, Clinton 1998, Trump 2019 & 2021</td></tr>
   <tr><td>Confirmation</td><td>Senate approves nominees</td><td>Robert Bork rejected 58–42 (1987); VP JD Vance broke a 50–50 tie to confirm Pete Hegseth as Defense Secretary (Jan. 2025)</td></tr>
   <tr><td>Treaty ratification</td><td>Senate, 2/3</td><td>Treaty of Versailles rejected (1919–20)</td></tr>
   <tr><td>Amendments</td><td>Propose by 2/3 of both chambers</td><td>27 amendments ratified</td></tr>
   <tr><td>Courts</td><td>Create lower courts, set their jurisdiction, fix the number of justices</td><td>Judiciary Act of 1789; FDR's failed 1937 court-packing plan</td></tr>
  </tbody>
 </table>

 <h3>War powers: the tug-of-war with the President</h3>
 <p>Congress <b>declares</b> war; the President is <b>commander in chief</b>. Congress has formally declared war in only five conflicts (the last in WWII). Since then, presidents have sent troops into Korea, Vietnam, Iraq, and elsewhere without a declaration. The <b>War Powers Resolution (1973)</b>, passed over Nixon's veto, requires the President to <b>notify Congress within 48 hours</b> of deploying troops and to <b>withdraw them within 60 days</b> (plus a 30-day withdrawal period) unless Congress authorizes the action. Presidents of both parties have called it unconstitutional, and Congress rarely enforces it. Congress more often passes an <b>Authorization for Use of Military Force (AUMF)</b>. The 2001 AUMF passed after 9/11 has been stretched to cover operations for over two decades.</p>

 <h3>Checks — both directions</h3>
 <div class="work">CONGRESS checks PRESIDENT:  override veto (2/3), impeach/remove, confirm/reject nominees,
                            ratify/reject treaties, power of the purse, oversight hearings
CONGRESS checks COURTS:     confirm judges, create lower courts, set jurisdiction,
                            propose amendments to overturn rulings, impeach judges
PRESIDENT checks CONGRESS:  veto, call special sessions, signing statements, bully pulpit
COURTS check CONGRESS:      judicial review — strike down laws (Marbury v. Madison, 1803)</div>

 <div class="trap">
  <div class="h">Where points get lost</div>
  <p><b>The elastic clause is Necessary and Proper, not the Commerce Clause.</b> The Commerce Clause is an enumerated power that has been read broadly. Necessary and Proper is the clause that creates implied powers.</p>
  <p><b>"Implied" doesn't mean "anything goes."</b> An implied power has to connect to an enumerated one. Marshall's test in McCulloch: "Let the end be legitimate… all means which are appropriate… are constitutional."</p>
  <p><b>The War Powers Resolution is a law, not an amendment.</b> It was passed over Nixon's veto, and no court has ever enforced it against a president.</p>
 </div>

 <div class="frq">
  <div class="h">FRQ language that scores</div>
  <p>"Congress can check the President's [action] by using its <b>power of the purse</b> to refuse to appropriate funds, which limits the President's ability to [carry out policy] because under Article I no money can be spent without an appropriation made by law."</p>
 </div>
 `,
 problems:[
  {kind:'Enumerated vs. implied',
   q:'Classify each as enumerated or implied: (1) coining money (2) creating the Federal Reserve (3) declaring war (4) establishing a national minimum wage (5) creating an Air Force.',
   sol:`<ol>
    <li>Coining money — <b>enumerated</b> (Art. I §8).</li>
    <li>Federal Reserve — <b>implied</b>. Justified by the powers to coin money and regulate its value, via Necessary and Proper; the direct descendant of McCulloch's national bank.</li>
    <li>Declaring war — <b>enumerated</b>.</li>
    <li>Minimum wage — <b>implied</b>, through the Commerce Clause (labor affects interstate commerce) plus Necessary and Proper.</li>
    <li>Air Force — <b>implied</b>. The Constitution mentions only armies and a navy (planes didn't exist); it's justified as "raising and supporting armies."</li></ol>
    <div class="ans">Enumerated: 1, 3. Implied: 2, 4, 5.</div>`},

  {kind:'Foundational document',
   q:'Which Anti-Federalist argument is most directly supported by the ruling in McCulloch v. Maryland?',
   sol:`<ol>
    <li>McCulloch used the Necessary and Proper Clause to expand federal power and the Supremacy Clause to block a state tax.</li>
    <li><b>Brutus No. 1</b> warned that exactly those two clauses would give Congress nearly unlimited power and shrink the states.</li>
    <li>From the Anti-Federalist perspective, McCulloch confirms the warning.</li></ol>
    <div class="ans">Brutus No. 1's warning that the Necessary and Proper and Supremacy Clauses would let the national government overpower the states.</div>`},

  {kind:'War powers scenario',
   q:'A president orders airstrikes against a foreign militia without congressional authorization and notifies congressional leaders 36 hours later. Seventy days pass without any vote in Congress. Under the War Powers Resolution, what should have happened, and what is Congress\'s most effective real-world tool?',
   sol:`<ol>
    <li>48-hour notification: met (36 hours).</li>
    <li>60-day clock: without authorization, forces should begin withdrawing by day 60, with up to 30 more days to complete it. At day 70 the President is inside the 30-day withdrawal window but should already be pulling out.</li>
    <li>Enforcement: the WPR has never been enforced by a court. Congress's most effective tool is the <b>power of the purse</b> — cutting off funding, as it did in Vietnam with the 1973 Case–Church Amendment.</li></ol>
    <div class="ans">Withdrawal should have begun at day 60 (within a 30-day window). Congress's strongest lever is refusing to fund the operation.</div>`},

  {kind:'Checks & balances',
   q:'The Supreme Court strikes down a federal law. Identify two ways Congress could respond.',
   sol:`<ol>
    <li>If the ruling was statutory interpretation, <b>rewrite the law</b> to fix the problem the Court identified. (After <i>Ledbetter v. Goodyear</i> (2007), Congress passed the Lilly Ledbetter Fair Pay Act of 2009.)</li>
    <li>If the ruling was constitutional, <b>propose a constitutional amendment</b> (2/3 of both chambers, then 3/4 of the states).</li>
    <li>Other options: change the Court's appellate jurisdiction, or shape future rulings through confirmations.</li></ol>
    <div class="ans">Pass a new or revised law; propose an amendment (also: limit jurisdiction, confirm different judges).</div>`},

  {kind:'Commerce Clause limit',
   q:'Explain how United States v. Lopez (1995) changed the relationship between Congress and the states.',
   sol:`<ol>
    <li>From the New Deal until 1995, the Court let Congress use the Commerce Clause to regulate almost anything with a loose economic connection.</li>
    <li>In Lopez, the Court held that possessing a gun in a school zone is not economic activity that substantially affects interstate commerce, and struck down the Gun-Free School Zones Act of 1990.</li>
    <li>Effect: it limited Congress's implied reach and returned some policing power to the states — a win for <b>federalism</b>.</li></ol>
    <div class="ans">Lopez set limits on the Commerce Clause, shrinking Congress's power and protecting state authority.</div>`}
 ]
},

/* ---------------------------------------------------------- 4.3 */
{
 id:'t43', num:'4.3', title:'Congressional Leadership',
 lede:'The Constitution names only a few congressional leaders. Everything else, including the real power, comes from the parties. Whoever controls the majority controls the agenda.',
 body:`
 <h3>Separate chambers, separate leadership</h3>
 <p>The House and Senate operate independently, with separate chambers, votes, offices, and operations, so each has its own leadership. Leaders are chosen by the <b>party caucus</b> (Democrats) or <b>conference</b> (Republicans) before each new Congress, and then (for the Speaker) ratified by a floor vote.</p>

 <h3>House leadership</h3>
 <table>
  <thead><tr><th>Position</th><th>Role</th><th>Now (119th Congress)</th></tr></thead>
  <tbody>
   <tr><td>Speaker of the House</td><td>Only House leader named in the Constitution. Presides, recognizes members to speak, refers bills to committee, puts motions to a vote, appoints select and conference committee members and the majority's Rules Committee members, and signs all passed bills. Can vote but rarely does. <b>2nd in line for the presidency.</b> The most powerful person in Congress.</td><td>Mike Johnson (R-LA)</td></tr>
   <tr><td>Majority Leader</td><td>Floor leader; sets the floor schedule, runs party strategy, serves as party spokesperson.</td><td>Steve Scalise (R-LA)</td></tr>
   <tr><td>Majority Whip</td><td>Assistant floor leader; counts votes and makes sure members show up.</td><td>Tom Emmer (R-MN)</td></tr>
   <tr><td>Minority Leader</td><td>Leads the opposition; would be the party's Speaker candidate.</td><td>Hakeem Jeffries (D-NY)</td></tr>
   <tr><td>Minority Whip</td><td>Counts minority votes.</td><td>Katherine Clark (D-MA)</td></tr>
  </tbody>
 </table>
 <p>The word "whip" comes from British fox hunting, where the "whipper-in" kept the hounds together as a pack.</p>

 <h3>Senate leadership</h3>
 <table>
  <thead><tr><th>Position</th><th>Role</th><th>Now</th></tr></thead>
  <tbody>
   <tr><td>President of the Senate</td><td>The <b>Vice President</b>. Not a member, not necessarily from the majority party. Votes <b>only to break a tie</b> and can't join debate. Rarely present.</td><td>JD Vance</td></tr>
   <tr><td>President pro tempore</td><td>Presides when the VP is absent (almost always), though the job is usually handed off to junior senators. By custom, the longest-serving member of the majority party. <b>3rd in line</b> for the presidency. Largely ceremonial.</td><td>Chuck Grassley (R-IA)</td></tr>
   <tr><td>Majority Leader</td><td><b>The most powerful senator.</b> Has the "right of first recognition" (speaks first), controls which bills reach the floor, files for cloture, and negotiates unanimous consent agreements.</td><td>John Thune (R-SD)</td></tr>
   <tr><td>Majority Whip</td><td>Counts votes.</td><td>John Barrasso (R-WY)</td></tr>
   <tr><td>Minority Leader</td><td>Leads the opposition; the filibuster gives this job real leverage.</td><td>Chuck Schumer (D-NY)</td></tr>
   <tr><td>Minority Whip</td><td>Counts minority votes.</td><td>Dick Durbin (D-IL)</td></tr>
  </tbody>
 </table>

 <h3>Line of succession (Presidential Succession Act of 1947)</h3>
 <div class="work">1. Vice President        (JD Vance)
2. Speaker of the House  (Mike Johnson)
3. President pro tempore (Chuck Grassley)
4. Secretary of State → other cabinet secretaries, in order of department creation</div>

 <h3>Namedroppable episodes</h3>
 <ul>
  <li><b>January 2023:</b> Kevin McCarthy needed <b>15 ballots</b> to become Speaker — the most since 1859 — because a small bloc of Republicans held out. To win them over he agreed to let a <b>single member</b> file a <b>motion to vacate</b> the chair.</li>
  <li><b>October 3, 2023:</b> Rep. Matt Gaetz filed that motion and McCarthy was removed <b>216–210</b>, the first Speaker ever ousted mid-term. The House couldn't legislate for three weeks until Mike Johnson was elected Speaker on October 25, 2023.</li>
  <li><b>Hakeem Jeffries</b> set the record for the longest House floor speech (8 hours, 44 minutes, July 2025) against the One Big Beautiful Bill Act. Party leaders can speak as long as they want using the "magic minute."</li>
  <li><b>Nancy Pelosi</b> (D-CA) was the first woman Speaker (2007–11 and 2019–23).</li>
 </ul>

 <h3>Why party leaders have so much power</h3>
 <p>Leaders control the <b>agenda</b> (which bills reach the floor), <b>committee assignments</b> (which members get prime seats), and <b>resources</b> (campaign money, staff, floor time). The majority party's control of the agenda is sometimes called "negative agenda control": a bill the majority leadership opposes usually never gets a vote. In the House this was formalized as the informal <b>Hastert Rule</b> — the Speaker doesn't bring a bill to the floor unless a "majority of the majority" supports it.</p>

 <div class="trap">
  <div class="h">Where points get lost</div>
  <p><b>The VP is not the Senate's real leader.</b> The Majority Leader is. The VP's only real legislative power is breaking ties — used for the One Big Beautiful Bill Act, which passed the Senate 51–50 on July 1, 2025.</p>
  <p><b>President pro tempore ≠ Majority Leader.</b> The pro tem is a seniority honor with the gavel; the Majority Leader controls the floor. MCQs switch these constantly.</p>
  <p><b>The Speaker is the only leader in either chamber who is both the presiding officer and the party leader.</b> In the Senate those roles are split, which is one reason the Senate is less hierarchical.</p>
 </div>

 <div class="frq">
  <div class="h">FRQ language that scores</div>
  <p>"The Speaker of the House can [refer the bill to an unfriendly committee / refuse to schedule a floor vote / appoint loyal members to the Rules Committee], which makes it less likely that the bill passes because the <b>majority party controls the legislative agenda</b>."</p>
 </div>
 `,
 problems:[
  {kind:'Match the leader',
   q:'Name the position: (1) breaks tie votes in the Senate (2) third in the line of succession (3) decides which bills reach the Senate floor (4) counts votes for the House majority (5) refers House bills to committee.',
   sol:`<ol>
    <li>Vice President (as President of the Senate)</li>
    <li>President pro tempore of the Senate</li>
    <li>Senate Majority Leader</li>
    <li>House Majority Whip</li>
    <li>Speaker of the House</li></ol>
    <div class="ans">VP · President pro tem · Senate Majority Leader · Majority Whip · Speaker</div>`},

  {kind:'Tie-break math',
   q:`The Senate is split 53–47. On a party-line bill, three majority-party senators defect and vote with the minority. What happens? What if four defect?`,
   sol:`<ol>
    <li>Three defect: 50 yes, 50 no → a tie. The VP casts the deciding vote (assuming the VP is from the majority party) → passes <b>51–50</b>. This is how the One Big Beautiful Bill Act passed in July 2025: three Republicans (Tillis, Paul, Collins) voted no, and VP Vance broke the tie.</li>
    <li>Four defect: 49 yes, 51 no → fails. The VP only votes on ties.</li>
    <li>Caveat: this only applies to majority-vote questions — budget reconciliation, nominations. A regular bill still faces the 60-vote cloture threshold.</li></ol>
    <div class="ans">3 defections → 50–50, VP breaks the tie, passes. 4 defections → fails 49–51.</div>`},

  {kind:'Concept application',
   q:`<p>In October 2023 the House spent three weeks without a Speaker after Kevin McCarthy was removed by a motion to vacate. During that time the House could not pass any legislation.</p><p>(A) Describe one power of the Speaker of the House. (B) Explain why the House could not function without a Speaker. (C) Explain how the rule change allowing a single member to force a motion to vacate affected the Speaker's power.</p>`,
   sol:`<ol>
    <li><b>(A)</b> The Speaker presides over the House, recognizes members, refers bills to committee, and schedules floor votes (with the majority leader).</li>
    <li><b>(B)</b> Floor action runs through the chair. Without a Speaker, no one can recognize members or put questions to a vote, and the House's only business is electing a new Speaker.</li>
    <li><b>(C)</b> Letting any one member force a vote on removal made the Speaker constantly vulnerable to a small faction. That shifted leverage from leadership to individual members and weakened the Speaker's ability to cut bipartisan deals, which is exactly what McCarthy's September 2023 stopgap funding deal triggered. (House Republicans raised the threshold to nine majority-party members in January 2025.)</li></ol>
    <div class="ans">Speaker controls the floor; without one the House is frozen; the one-member motion to vacate weakened the Speaker by making them hostage to small factions.</div>`},

  {kind:'Party control',
   q:'Explain why party control of the majority matters more in the House than in the Senate.',
   sol:`<ol>
    <li>In the House, the majority party controls the Speaker, the Rules Committee (9–4 majority ratio), and floor time. A bare majority can pass nearly anything it agrees on.</li>
    <li>In the Senate, the filibuster lets 41 senators block most legislation, and unanimous consent practices give individual senators leverage. The majority controls the agenda but usually needs minority votes to finish.</li></ol>
    <div class="ans">House rules let a unified majority pass bills alone; Senate rules (filibuster, unanimous consent) give the minority and individual senators real power.</div>`},

  {kind:'Majority leader',
   q:'Why is the Senate Majority Leader often considered more powerful than the Vice President in the Senate, even though the VP is the Senate\'s constitutional presiding officer?',
   sol:`<ol>
    <li>The VP presides rarely, can't debate, and votes only to break ties.</li>
    <li>The Majority Leader has the right of first recognition, decides which bills and nominations reach the floor, files cloture motions, and negotiates unanimous consent agreements that set the terms of debate.</li>
    <li>Power in Congress comes from agenda control, not the title of presiding officer.</li></ol>
    <div class="ans">The Majority Leader controls the floor agenda; the VP's formal role is mostly ceremonial except for tie-breaking.</div>`}
 ]
},

/* ---------------------------------------------------------- 4.4 */
{
 id:'t44', num:'4.4', title:'Committees',
 lede:'Woodrow Wilson wrote in 1885 that "Congress in session is Congress on public exhibition, whilst Congress in its committee-rooms is Congress at work." Committees are where most of the lawmaking happens, and where most bills die.',
 body:`
 <h3>Why committees exist</h3>
 <ul>
  <li><b>Division of labor.</b> More than 10,000 bills are introduced every Congress; no member can study them all.</li>
  <li><b>Specialization.</b> Members build expertise in areas like tax, defense, or agriculture, often ones that matter to their district.</li>
  <li><b>Gatekeeping.</b> Committees filter bills, and most never make it out.</li>
  <li><b>Oversight.</b> Committees hold hearings and investigate the executive branch.</li>
 </ul>

 <h3>The four types</h3>
 <table>
  <thead><tr><th>Type</th><th>What it is</th><th>Examples</th></tr></thead>
  <tbody>
   <tr><td>Standing</td><td><b>Permanent</b> panels organized by subject; the main lawmaking committees. They filter bills in their policy area. <b>20 in the House, 16 in the Senate.</b></td><td>House Ways and Means (taxes), House Appropriations, House Rules; Senate Finance, Senate Judiciary (Supreme Court confirmation hearings), Senate Foreign Relations, Armed Services in both</td></tr>
   <tr><td>Select (special)</td><td>Created for a <b>specific purpose</b>, often an investigation. Usually temporary, can't usually report bills.</td><td>Senate Watergate Committee (1973, chaired by Sam Ervin; hearings revealed Nixon's taping system); House Select Committee on the January 6th Attack (2021–22, chair Bennie Thompson, vice chair Liz Cheney). Some are permanent, such as the Intelligence committees.</td></tr>
   <tr><td>Joint</td><td>Members of <b>both</b> chambers. Usually study issues or handle housekeeping; can be temporary or permanent.</td><td>Joint Economic Committee, Joint Committee on Taxation, Joint Committee on Printing, Joint Committee on the Library</td></tr>
   <tr><td>Conference</td><td>A <b>temporary</b> joint committee that irons out differences between House and Senate versions of a bill and produces one compromise text that both chambers vote on.</td><td>Now rare. Leaders more often negotiate privately or use "<b>ping-pong</b>" (passing amended versions back and forth).</td></tr>
  </tbody>
 </table>
 <p><b>Subcommittees</b> are smaller divisions of a standing committee that handle one part of its workload. They hold hearings, "mark up" bills (revise them line by line), and make recommendations to the full committee. For example, the Senate Judiciary Committee has six subcommittees.</p>

 <h3>Power committees to namedrop</h3>
 <div class="cards">
  <div class="card"><div class="k">House Rules</div><div class="v">The "traffic cop." Sets the terms of debate for nearly every major bill. The Speaker picks the majority's members, so it's an arm of leadership.</div></div>
  <div class="card"><div class="k">House Ways and Means</div><div class="v">Writes tax law. It's the oldest committee, and revenue bills must start in the House.</div></div>
  <div class="card"><div class="k">Appropriations (both)</div><div class="v">Writes the 12 annual spending bills. Its members are nicknamed "cardinals" for how much power they have over money.</div></div>
  <div class="card"><div class="k">Senate Judiciary</div><div class="v">Holds confirmation hearings for federal judges, including Supreme Court nominees such as Kavanaugh (2018) and Jackson (2022).</div></div>
 </div>

 <h3>Chairs and the seniority rule</h3>
 <p><b>Committee chairs</b> always come from the <b>majority party</b>. They set the agenda, schedule meetings, decide which bills get attention, decide whether to hold hearings, and control committee staff. A chair who refuses to schedule a bill can kill it quietly. That's called <b>pigeonholing</b>. The top minority-party member is the <b>ranking member</b>.</p>
 <p>Chairs have traditionally been picked by the <b>seniority rule</b>, an unwritten custom of giving the chair to the majority member with the longest continuous service on that committee.</p>
 <table>
  <thead><tr><th>Pros of seniority</th><th>Cons of seniority</th></tr></thead>
  <tbody><tr><td>Chairs have experience and expertise; avoids fights within the party; simple and predictable</td><td>Ignores ability and new ideas; favors members from safe seats; limits fresh leadership</td></tr></tbody>
 </table>
 <p>Seniority is weaker today. Since 1995 (Newt Gingrich's "Contract with America" Congress), House Republicans have limited chairs to <b>three consecutive terms (six years)</b>, and party leaders now weigh loyalty and fundraising too.</p>

 <h3>Assignments and ratios</h3>
 <ul>
  <li>House members usually sit on 1–2 committees; senators on 3–4.</li>
  <li>New members submit a "wish list." They want either a <b>prestige committee</b> (Rules, Ways and Means, Appropriations, Finance) or one that serves their district directly (a farm-state member on Agriculture, a Navy-town member on Armed Services).</li>
  <li>Party ratios on each committee roughly track the chamber's party split, so the majority controls every committee. The House Rules Committee is deliberately lopsided at 9–4.</li>
 </ul>

 <h3>Iron triangles — where committees meet lobbying</h3>
 <p>A standing committee, the executive agency it oversees, and the interest groups affected form a stable, mutually beneficial <b>iron triangle</b>. For example: the House Armed Services Committee, the Department of Defense, and defense contractors. Committees give agencies funding and friendly oversight, agencies give interest groups favorable rules, and interest groups give members campaign support. (This is covered more fully in the bureaucracy unit.)</p>

 <div class="trap">
  <div class="h">Where points get lost</div>
  <p><b>Joint ≠ conference.</b> Both include members of both chambers, but a conference committee exists only to reconcile one specific bill. Joint committees study issues or do routine work.</p>
  <p><b>Select committees investigate; standing committees legislate.</b> If the question says "investigate a specific event," the answer is select.</p>
  <p><b>Committees, not floor votes, kill most bills.</b> On "at which stage do most bills die?" the answer is committee (and within it, subcommittee).</p>
 </div>

 <div class="frq">
  <div class="h">FRQ language that scores</div>
  <p>"Because committee chairs are members of the <b>majority party</b> and control the committee's agenda, a chair can <b>refuse to schedule hearings or a markup</b>, which prevents the bill from reaching the floor."</p>
 </div>
 `,
 problems:[
  {kind:'Identify the type',
   q:'Name the committee type: (1) created to investigate a 2021 attack on the Capitol (2) permanent panel that writes tax law (3) House and Senate members reconciling two versions of a defense bill (4) House and Senate members producing an annual economic report.',
   sol:`<ol>
    <li>Select (House Select Committee on the January 6th Attack)</li>
    <li>Standing (Ways and Means / Senate Finance)</li>
    <li>Conference</li>
    <li>Joint (Joint Economic Committee)</li></ol>
    <div class="ans">Select · Standing · Conference · Joint</div>`},

  {kind:'Concept application',
   q:`<p>A first-term representative from rural Iowa, where corn and ethanol drive the economy, hopes to be assigned to the House Agriculture Committee rather than the Foreign Affairs Committee.</p><p>(A) Describe one reason members seek particular committee assignments. (B) Explain how serving on the Agriculture Committee could help this representative win reelection.</p>`,
   sol:`<ol>
    <li><b>(A)</b> Members seek committees that match their constituents' economic interests, so they can shape policy that directly affects their district.</li>
    <li><b>(B)</b> On Agriculture, the representative can shape the farm bill's crop subsidies and ethanol mandates. Delivering visible benefits to district farmers earns credit, builds name recognition, and attracts support from agricultural interest groups — all of which strengthen the <b>incumbency advantage</b>.</li></ol>
    <div class="ans">Members pick committees that serve their district; delivering benefits builds credit with voters and groups, which helps with reelection.</div>`},

  {kind:'Seniority rule',
   q:'Give one argument for and one argument against the seniority rule, and explain how House Republicans changed it.',
   sol:`<ol>
    <li>For: chairs bring years of policy expertise and institutional knowledge; the rule is predictable and avoids fights within the party.</li>
    <li>Against: it rewards longevity, not skill; it tends to give chairs to members from safe seats who may be out of step with the party; talented newer members are shut out.</li>
    <li>Change: since 1995, House Republicans have limited chairs to three consecutive terms (six years), and leadership influences who gets chair positions.</li></ol>
    <div class="ans">Pro: experience/stability. Con: ignores ability, limits new leadership. GOP term limits on chairs (6 years) weakened seniority.</div>`},

  {kind:'Where bills die',
   q:'Explain why most bills introduced in Congress never receive a floor vote.',
   sol:`<ol>
    <li>Thousands of bills are introduced for reasons other than passage: messaging, credit-claiming, signaling to groups.</li>
    <li>Committees are gatekeepers. The chair (majority party) decides which bills get hearings and markups, and most are never scheduled (pigeonholed).</li>
    <li>Even bills reported out still need the Rules Committee (House) or majority leader (Senate) to schedule floor time.</li></ol>
    <p>Only about 2–4% of bills introduced in a typical Congress become law.</p>
    <div class="ans">Committees and chairs filter bills; most are pigeonholed and never reported, so they never reach the floor.</div>`},

  {kind:'Oversight',
   q:'How do committees carry out congressional oversight of the executive branch? Give a specific example.',
   sol:`<ol>
    <li>Committees hold hearings, call executive officials to testify, subpoena documents and witnesses, and review agency budgets.</li>
    <li>Example: the Senate Watergate Committee (1973) held televised hearings where aide Alexander Butterfield revealed Nixon's White House taping system. That led to the tapes fight and Nixon's 1974 resignation.</li></ol>
    <div class="ans">Through hearings, investigations, subpoenas, and budget review, as in the Senate Watergate Committee's investigation of Nixon.</div>`}
 ]
},

/* ---------------------------------------------------------- 4.5 */
{
 id:'t45', num:'4.5', title:'How a Bill Becomes a Law',
 lede:'The process is designed with more exits than entrances. Every step is a place where a determined minority can stop a bill, which is exactly what the framers wanted.',
 body:`
 <h3>Bills, laws, and resolutions</h3>
 <p>A <b>bill</b> is a proposed law. It becomes a <b>law</b> only after both chambers pass identical text and the President signs it (or Congress overrides a veto, or 10 days pass while Congress is in session). Other types of legislation:</p>
 <table>
  <thead><tr><th>Type</th><th>Passed by</th><th>President?</th><th>Force of law?</th><th>Used for</th></tr></thead>
  <tbody>
   <tr><td>Simple resolution</td><td>One chamber</td><td>No</td><td>No</td><td>That chamber's own rules; honoring people</td></tr>
   <tr><td>Concurrent resolution</td><td>Both</td><td>No</td><td>No</td><td>Joint business: adjournment, the budget resolution</td></tr>
   <tr><td>Joint resolution</td><td>Both</td><td>Yes (except amendments)</td><td>Yes</td><td>Same as a bill; also proposing constitutional amendments (2/3 each, no President) and declarations of war</td></tr>
  </tbody>
 </table>
 <p>Bills ultimately start with the people. Interest groups, parties, the media, and the President push for them, but only a member of Congress can introduce one. House bills are numbered <b>H.R. ###</b> and Senate bills <b>S. ###</b>.</p>

 ${billMap()}

 <h3>Step by step (House version, since it has the extra step)</h3>
 <ol>
  <li><b>Introduction.</b> A member drops the bill in the "hopper." It gets a number, and the Speaker refers it to a standing committee.</li>
  <li><b>Committee.</b> The chair usually sends it to a <b>subcommittee</b> for hearings and <b>markup</b>. The full committee then votes. Options: report it favorably, <b>kill it</b> (most common, often by pigeonholing), amend it, report it unfavorably (rare), or write a new committee bill. <b>Most bills die here.</b></li>
  <li><b>Discharge petition.</b> If a committee is sitting on a bill, a majority of the House (<b>218 signatures</b>) can force it to the floor. This rarely works. Recent example: the Epstein Files Transparency Act petition reached 218 in November 2025, and the bill then passed 427–1.</li>
  <li><b>Rules Committee (House only).</b> Sets the terms of debate: time limits and whether amendments are allowed. A <b>closed rule</b> bans amendments; an <b>open rule</b> allows any germane amendment; a <b>structured (modified) rule</b> allows only listed ones. Major bills now almost always get closed or structured rules.</li>
  <li><b>Floor debate.</b> Strict time limits, and amendments must be <b>germane</b> (on topic). Much of it happens in the <b>Committee of the Whole</b>, which needs a quorum of only 100.</li>
  <li><b>Vote.</b> A simple majority of those voting. With all 435 seats filled and everyone voting, that's 218.</li>
  <li><b>Second chamber.</b> The same process repeats. If the second chamber passes a different version, the two must be reconciled by a <b>conference committee</b> or ping-pong, and both chambers must pass the final identical text.</li>
  <li><b>President.</b> Has <b>10 days (Sundays excepted)</b> to sign or veto.</li>
 </ol>

 <h3>What's different in the Senate</h3>
 <ul>
  <li><b>No Rules Committee gate.</b> The Majority Leader schedules bills, usually through <b>unanimous consent agreements</b>. One objecting senator can block unanimous consent.</li>
  <li><b>Holds.</b> A senator can signal they'll object to unanimous consent on a bill or nomination. Sen. Tommy Tuberville held up hundreds of military promotions for about ten months in 2023 to protest a Pentagon abortion-travel policy.</li>
  <li><b>Unlimited debate → the filibuster.</b> Senators can talk as long as they want to stall or kill a bill. Today most filibusters are just a <em>threat</em>: the majority won't bring a bill up without 60 votes.</li>
  <li><b>Cloture</b> (Senate Rule XXII) ends debate with <b>60 votes</b> (3/5 of the full Senate). Created in 1917 at 2/3; lowered to 3/5 in 1975.</li>
  <li><b>Non-germane amendments (riders)</b> are allowed. A bill loaded with unrelated riders is a "Christmas tree bill."</li>
 </ul>
 <p><b>Record speeches:</b> Strom Thurmond filibustered the Civil Rights Act of 1957 for <b>24 hours, 18 minutes</b>, a record that stood until Cory Booker spoke for <b>25 hours, 5 minutes</b> in April 2025. Booker's speech was a protest, not a filibuster of a specific bill.</p>
 <p><b>The nuclear option:</b> a simple-majority vote to reinterpret Senate rules. In 2013, Democrats (Harry Reid) eliminated the filibuster for lower-court and executive nominees; in 2017, Republicans (Mitch McConnell) extended it to Supreme Court nominees (Gorsuch). The <b>legislative filibuster</b> on ordinary bills still stands. Senate Republicans rejected President Trump's calls to abolish it during the 2025 shutdown.</p>
 <p><b>Exceptions to the filibuster:</b> budget <b>reconciliation</b> bills (limited to 20 hours of debate, simple majority), nominations, and certain fast-track procedures such as the Congressional Review Act.</p>

 <h3>The President's options</h3>
 <div class="cards">
  <div class="card"><div class="k">Sign</div><div class="v">Becomes law. May add a <b>signing statement</b> interpreting the law or saying how it will be enforced.</div></div>
  <div class="card"><div class="k">Veto</div><div class="v">Returned to Congress with objections. <b>Override: 2/3 of both chambers.</b> Fewer than 1 in 10 regular vetoes are overridden.</div></div>
  <div class="card"><div class="k">Do nothing (in session)</div><div class="v">After 10 days (excluding Sundays), becomes law <b>without</b> a signature.</div></div>
  <div class="card"><div class="k">Pocket veto</div><div class="v">Do nothing, and Congress <b>adjourns</b> within the 10 days → the bill dies. <b>Can't be overridden.</b></div></div>
 </div>
 <p>There's no <b>line-item veto</b>. Congress gave the President one in 1996, but the Court struck it down in <b>Clinton v. City of New York (1998)</b>, holding that it violated the Presentment Clause. The President has to accept or reject a whole bill, which is why riders work.</p>

 <h3>Deal-making vocabulary</h3>
 <ul>
  <li><b>Logrolling</b>: vote trading. "I'll vote for your farm bill if you vote for my highway bill."</li>
  <li><b>Pork barrel spending</b>: funding for local projects meant to win votes back home. The classic example is Alaska's $398 million "<b>Bridge to Nowhere</b>" (2005).</li>
  <li><b>Earmarks</b>: provisions directing money to specific projects. Banned in 2011, then brought back in 2021 as "Community Project Funding."</li>
  <li><b>Rider</b>: an unrelated provision attached to a bill likely to pass.</li>
 </ul>

 <div class="trap">
  <div class="h">Where points get lost</div>
  <p><b>"Does nothing for 10 days" has two outcomes.</b> If Congress is in session, the bill becomes law. If Congress has adjourned, it's a pocket veto. Your class notes only cover the first case, and the exam tests both.</p>
  <p><b>Filibuster ≠ cloture.</b> The filibuster is unlimited debate; cloture is the 60-vote motion that ends it. And they only exist in the Senate.</p>
  <p><b>The Rules Committee is House-only.</b> If an answer choice puts it in the Senate, it's wrong.</p>
  <p><b>Discharge petition = 218 in the House.</b> Don't confuse it with cloture (60 in the Senate).</p>
 </div>

 <div class="frq">
  <div class="h">FRQ language that scores</div>
  <p>"Because Senate rules allow <b>unlimited debate</b>, a minority of 41 senators can <b>filibuster</b> a bill, and the majority needs <b>60 votes to invoke cloture</b>. This makes it harder to pass legislation in the Senate than in the House, where the <b>Rules Committee</b> limits debate."</p>
 </div>
 `,
 problems:[
  {kind:'Sequence',
   q:'Put these in order for a bill that starts in the House: (a) Rules Committee sets a closed rule (b) subcommittee holds hearings and marks up the bill (c) Speaker refers the bill to a standing committee (d) Senate invokes cloture (e) conference committee reconciles versions (f) House floor vote.',
   sol:`<div class="work">(c) referral → (b) subcommittee hearings & markup → (a) Rules Committee
→ (f) House floor vote → (d) Senate cloture & passage → (e) conference</div>
    <p>After conference, both chambers pass the final version, and it goes to the President.</p>
    <div class="ans">c → b → a → f → d → e</div>`},

  {kind:'Presidential action',
   q:'Congress sends a bill to the President on December 15 and adjourns for the year on December 20. The President never signs it. What happens? What if Congress had stayed in session through January?',
   sol:`<ol>
    <li>The President has 10 days, excluding Sundays. Congress adjourned before the 10 days were up, and the President took no action → <b>pocket veto</b>. The bill dies and can't be overridden. Congress would have to start over.</li>
    <li>If Congress had stayed in session, the bill would <b>become law without a signature</b> once the 10 days passed.</li></ol>
    <div class="ans">Adjourned → pocket veto (dies, no override). In session → becomes law without a signature.</div>`},

  {kind:'Override math',
   q:'The President vetoes a bill. In the House, 290 of 435 members vote to override (all present). In the Senate, 66 of 100 vote to override. Is the veto overridden?',
   sol:`<ol>
    <li>House: 2/3 of 435 = 290. 290 ≥ 290 → <b>passes</b> (exactly 2/3).</li>
    <li>Senate: 2/3 of 100 = 66.67 → needs 67. 66 < 67 → <b>fails</b>.</li>
    <li>An override needs 2/3 in <b>both</b> chambers, so the veto stands.</li></ol>
    <div class="work">House  2/3 × 435 = 290.0  → 290 ✓
Senate 2/3 × 100 = 66.7   → 66  ✗</div>
    <div class="ans">Not overridden. The Senate fell one vote short of 67.</div>`},

  {kind:'Concept application',
   q:`<p>A bill to expand broadband access passed the House 262–170. In the Senate, 57 senators support it, but the minority leader has announced his party will filibuster.</p><p>(A) Identify the Senate procedure needed to end a filibuster. (B) Explain why the bill passed easily in the House but is stuck in the Senate. (C) Describe one strategy supporters could use to get the bill through the Senate.</p>`,
   sol:`<ol>
    <li><b>(A)</b> Cloture: 60 votes (3/5 of the Senate).</li>
    <li><b>(B)</b> In the House, the Rules Committee limits debate and a simple majority passes a bill, so 262 votes is plenty. The Senate allows unlimited debate, so a minority can block a vote. 57 supporters is a majority but three short of cloture.</li>
    <li><b>(C)</b> Options: negotiate amendments to win three more senators; if the provisions are budgetary, pass them through <b>reconciliation</b> (majority vote, no filibuster); attach them to must-pass legislation such as an appropriations bill; or, in theory, use the nuclear option to change the rules.</li></ol>
    <div class="ans">(A) Cloture/60. (B) House rules limit debate; the Senate permits unlimited debate. (C) Compromise for 3 votes, reconciliation, or attach to must-pass legislation.</div>`},

  {kind:'Discharge petition',
   q:'A bill has 230 cosponsors in the House, but the committee chair refuses to hold a hearing. What can supporters do, and why does this rarely succeed?',
   sol:`<ol>
    <li>File a <b>discharge petition</b>. Once 218 members sign, the bill is forced out of committee and onto the floor.</li>
    <li>It rarely works because majority-party members don't like to defy their own leadership by signing. Leaders control committee assignments, campaign support, and future favors. Cosponsoring is cheap; signing a discharge petition is an open challenge to leadership.</li>
    <li>Successes are memorable exactly because they're rare: McCain–Feingold campaign finance reform (2002) and the Epstein Files Transparency Act (2025).</li></ol>
    <div class="ans">Discharge petition (218 signatures). It rarely succeeds because members won't openly defy party leaders.</div>`},

  {kind:'Line-item veto',
   q:'A senator attaches a rider funding a museum in her state to a must-pass defense bill. The President objects to the rider but supports the rest. What are the President\'s options, and why?',
   sol:`<ol>
    <li>The President has no line-item veto. <b>Clinton v. City of New York (1998)</b> struck down the 1996 Line Item Veto Act as a violation of the Presentment Clause.</li>
    <li>Options: sign the whole bill (and possibly issue a signing statement objecting), or veto the whole bill, which would block defense funding too.</li>
    <li>That all-or-nothing choice is exactly why members attach riders to must-pass bills.</li></ol>
    <div class="ans">Sign the whole bill or veto the whole bill; the line-item veto is unconstitutional, which is why riders work.</div>`}
 ]
},
